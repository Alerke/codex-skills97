  const readText = (value, fallback) => {
    if (typeof value !== 'string' && typeof value !== 'number') return fallback;
    const text = String(value).trim();

    const color = readText(value, '');

    return /^#(?:[\da-f]{3}|[\da-f]{6}|[\da-f]{8})$/i.test(color) ? color : fallback;

      card.removeAttribute('target');

  root.style.setProperty('--ltd-retreat-label', validColor(dataset.labelColor, '#f7f8f5'));
  root.style.setProperty('--ltd-retreat-card-text', validColor(dataset.cardTextColor, '#f7f8f5'));
  root.style.setProperty('--ltd-retreat-card-meta', validColor(dataset.cardMetaColor, 'rgba(247,248,245,.52)'));
  root.style.setProperty('--ltd-retreat-heading-size', readNumber(dataset.headingSize, 62, 24, 100) + 'px');
  root.style.setProperty('--ltd-retreat-label-size', readNumber(dataset.labelSize, 16, 10, 36) + 'px');
  root.style.setProperty('--ltd-retreat-card-title-size', readNumber(dataset.cardTitleSize, 18, 12, 42) + 'px');
  root.style.setProperty('--ltd-retreat-card-meta-size', readNumber(dataset.cardMetaSize, 16, 10, 32) + 'px');

  const cards = root.querySelectorAll('.ltd-retreats-card');
  for (let index = 0; index < cards.length; index += 1) {
    const card = cards[index];
    const image = card.querySelector('.ltd-retreats-image');
    const src = readText(image.getAttribute('src'), '');
    if (!src || /^\$\[/.test(src)) card.classList.add('is-media-error');
    image.addEventListener('error', () => card.classList.add('is-media-error'));
    normalizeLink(card);
  }

  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let observer = null;
  const pointerBindings = [];

  if (!reducedMotion && 'IntersectionObserver' in window) {
    root.classList.add('is-motion-ready');
    observer = new IntersectionObserver((entries) => {
      for (let index = 0; index < entries.length; index += 1) {
        if (!entries[index].isIntersecting) continue;
        entries[index].target.classList.add('is-visible');
        observer.unobserve(entries[index].target);
      }
    }, { threshold: .12, rootMargin: '0px 0px -6% 0px' });
    const reveals = root.querySelectorAll('.ltd-retreats-reveal');
    for (let index = 0; index < reveals.length; index += 1) observer.observe(reveals[index]);
  }

  const finePointer = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (!reducedMotion && finePointer) {
    for (let index = 0; index < cards.length; index += 1) {
      const card = cards[index];
      const media = card.querySelector('.ltd-retreats-media');
      const move = (event) => {
        const rect = media.getBoundingClientRect();
        const x = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
        const y = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
        media.style.setProperty('--ltd-spot-x', (x * 100) + '%');
        media.style.setProperty('--ltd-spot-y', (y * 100) + '%');
        card.style.setProperty('--ltd-card-x', (x * 100) + '%');
        card.style.setProperty('--ltd-card-y', (y * 100) + '%');
        card.style.setProperty('--ltd-tilt-x', ((.5 - y) * 7) + 'deg');
        card.style.setProperty('--ltd-tilt-y', ((x - .5) * 7) + 'deg');
        card.style.setProperty('--ltd-image-x', ((.5 - x) * 8) + 'px');
        card.style.setProperty('--ltd-image-y', ((.5 - y) * 8) + 'px');
      };
      const leave = () => {
        card.style.setProperty('--ltd-tilt-x', '0deg');
        card.style.setProperty('--ltd-tilt-y', '0deg');
        card.style.setProperty('--ltd-image-x', '0px');
        card.style.setProperty('--ltd-image-y', '0px');
      };
      card.addEventListener('pointermove', move);
      card.addEventListener('pointerleave', leave);
      pointerBindings.push({ node: card, move: move, leave: leave });
    }
  }

  root._ltdRetreatsCleanup = () => {
    if (observer) observer.disconnect();
    for (let index = 0; index < pointerBindings.length; index += 1) {
      pointerBindings[index].node.removeEventListener('pointermove', pointerBindings[index].move);
      pointerBindings[index].node.removeEventListener('pointerleave', pointerBindings[index].leave);
    }
  };
}());
</script>
</div></body></html>
