    if (window.parent && window.parent !== window) contexts.push(window.parent);
    if (window.top && contexts.indexOf(window.top) === -1) contexts.push(window.top);
    for (let index = 0; index < contexts.length; index += 1) {
      try {
        if (typeof contexts[index].r === 'function') return { context: contexts[index], request: contexts[index].r };
      } catch (error) { continue; }
    }
    return null;
  };
  const request = (url, data) => {
    const requestData = {};
    Object.keys(data || {}).forEach((key) => { if (data[key] !== '' && data[key] != null) requestData[key] = data[key]; });
    const currentWebsiteId = readWebsiteId();
    if (currentWebsiteId) requestData.website_id = currentWebsiteId;
    const bridge = isEditorContext ? resolveRequestBridge() : null;
    if (bridge) {
      try { return Promise.resolve(bridge.request.call(bridge.context, url, requestData, 'GET')); } catch (error) { return Promise.reject(error); }
    }
    const query = Object.keys(requestData).map((key) => encodeURIComponent(key) + '=' + encodeURIComponent(requestData[key])).join('&');
    const requestUrl = url + (query ? '?' + query : '');
    if (typeof window.fetch === 'function') {
      return window.fetch(requestUrl, { credentials: 'same-origin' }).then((response) => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      });
    }
    if (typeof window.XMLHttpRequest === 'function') {
      return new Promise((resolve, reject) => {
        const xhr = new window.XMLHttpRequest();
        xhr.open('GET', requestUrl, true);
        xhr.withCredentials = true;
        xhr.onreadystatechange = () => {
          if (xhr.readyState !== 4) return;
          if (xhr.status < 200 || xhr.status >= 300) { reject(new Error('HTTP ' + xhr.status)); return; }
          try { resolve(JSON.parse(xhr.responseText)); } catch (error) { reject(error); }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.send(null);
      });
    }
    return Promise.reject(new Error('Request unavailable'));
  };
  const waitForWebsiteId = (attempts) => new Promise((resolve) => {
    const check = (remaining) => {
      const currentWebsiteId = readWebsiteId();
      if (currentWebsiteId || remaining <= 0) { resolve(currentWebsiteId); return; }
      window.setTimeout(() => check(remaining - 1), 120);
    };
    check(attempts);
  });
  const normalizeCategoryNodes = (response) => {
    const normalized = unwrapResponse(response);
    const data = normalized && normalized.data;
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.data)) return data.data;
    return [];
  };
  const indexCategories = (nodes) => {
    state.categoryMap.clear();
    state.categoryRoots = [];
    const visit = (items, parentId) => (Array.isArray(items) ? items : []).forEach((item) => {
      if (!item || item.id == null) return;
      const id = String(item.id);
      const children = Array.isArray(item.children) ? item.children : [];
      const node = { id: id, name: String(item.name || item.title || ''), children: children, parentId: parentId || '' };
      state.categoryMap.set(id, node);
      if (!parentId) state.categoryRoots.push(node);
      visit(children, id);
    });
    visit(nodes, '');
  };
  const expandCategory = (id, output) => {
    const key = String(id);
    if (output.indexOf(key) !== -1) return;
    output.push(key);
    const node = state.categoryMap.get(key);
    if (node) node.children.forEach((child) => { if (child && child.id != null) expandCategory(String(child.id), output); });
  };
  const currentQueryCatIds = () => {
    if (state.selectedCatId) {
      const selected = [];
      expandCategory(state.selectedCatId, selected);
      return selected;
    }
    return state.allowedScopeIds.slice();
  };
  const categoryName = (id) => {
    const node = id ? state.categoryMap.get(String(id)) : null;
    return node ? node.name : '';
  };
  const updateToolbarVisibility = () => { toolbar.hidden = !!categoryBar.hidden && !!searchForm.hidden; };
  const visibleCategoryNodes = () => {
    if (!config.catIds.length) return state.categoryRoots.slice();
    return config.catIds.map((id) => state.categoryMap.get(String(id))).filter(Boolean);
  };
  const createCategoryButton = (label, id) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'news-category-button' + (state.selectedCatId === id ? ' is-active' : '');
    button.textContent = label;
    button.setAttribute('aria-pressed', state.selectedCatId === id ? 'true' : 'false');
    button.addEventListener('click', () => {
      if (state.selectedCatId === id) return;
      state.selectedCatId = id;
      state.page = 1;
      state.pageCorrectionUsed = false;
      renderCategoryFilter();
      loadList();
    });
    return button;
  };
  const renderCategoryFilter = () => {
    clear(categoryBar);
    if (!config.showCategoryFilter) { categoryBar.hidden = true; updateToolbarVisibility(); return; }
    const nodes = visibleCategoryNodes();
    if (!nodes.length) { categoryBar.hidden = true; updateToolbarVisibility(); return; }
    categoryBar.hidden = false;
    categoryBar.appendChild(createCategoryButton(text('all'), ''));
    nodes.forEach((node) => {
      if (node.name) categoryBar.appendChild(createCategoryButton(node.name, node.id));
    });
    updateToolbarVisibility();
  };
  const loadCategories = () => request('/api/gatewayCms/articles/category', { mold_types: config.type, language_type: language }).then((response) => {
    indexCategories(normalizeCategoryNodes(response));
    const allowed = [];
    config.catIds.forEach((id) => expandCategory(id, allowed));
    state.allowedScopeIds = allowed;
    renderCategoryFilter();
  }).catch(() => {
    state.allowedScopeIds = config.catIds.slice();
    categoryBar.hidden = true;
    updateToolbarVisibility();
  });
  const renderLoading = () => {
    clear(grid);
    pagination.hidden = true;
    const count = Math.min(config.pageSize, Math.max(1, columns));
    for (let index = 0; index < count; index += 1) {
      const skeleton = document.createElement('div');
      skeleton.className = 'news-skeleton';
      skeleton.setAttribute('aria-label', text('loading'));
      grid.appendChild(skeleton);
    }
  };
  const renderMessage = (message, retry) => {
    clear(grid);
    pagination.hidden = true;
    const status = document.createElement('div');
    status.className = 'news-status';
    const label = document.createElement('span');
    label.textContent = message;
    status.appendChild(label);
    if (retry) {
      const button = document.createElement('button');
      button.className = 'news-retry';
      button.type = 'button';
      button.textContent = text('retry');
      button.addEventListener('click', () => initializeData());
      status.appendChild(button);
    }
    grid.appendChild(status);
  };
  const placeholderSvg = () => '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 11h32v26H8zM8 31l9-9 7 7 5-5 11 11M31 18h.01" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></svg>';
  const renderItems = (items) => {
    clear(grid);
    const fragment = document.createDocumentFragment();
    items.forEach((item) => {
      const href = detailUrl(item);
      const article = document.createElement('article');
      article.className = 'news-card';
      const media = document.createElement(href ? 'a' : 'div');
      media.className = 'news-media' + (item.cover ? '' : ' news-image-placeholder');
      if (href) media.href = href;
      if (item.cover) {
        const image = document.createElement('img');
        image.className = 'news-image';
        image.src = item.cover;
        image.alt = item.title;
        image.loading = 'lazy';
        media.appendChild(image);
      } else {
        media.innerHTML = placeholderSvg();
      }
      article.appendChild(media);
      const category = config.showCategory ? categoryName(item.catId) : '';
      if (category || (config.showDate && item.date)) {
        const meta = document.createElement('div');
        meta.className = 'news-meta';
        if (category) {
          const categoryNode = document.createElement('span');
          categoryNode.className = 'news-category';
          categoryNode.textContent = category;
          meta.appendChild(categoryNode);
        }
        if (config.showDate && item.date) {
          const date = document.createElement('time');
          date.className = 'news-date';
          date.textContent = item.date;
          meta.appendChild(date);
        }
        article.appendChild(meta);
      }
      const title = document.createElement('h3');
      title.className = 'news-card-title';
      const titleContent = document.createElement(href ? 'a' : 'span');
      if (href) titleContent.href = href;
      titleContent.textContent = item.title;
      title.appendChild(titleContent);
      article.appendChild(title);
      fragment.appendChild(article);
    });
    grid.appendChild(fragment);
  };
  const createPageButton = (label, page, disabled, current, ariaLabel) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'news-page-button' + (current ? ' is-current' : '');
    button.textContent = label;
    button.disabled = !!disabled;
    if (ariaLabel) button.setAttribute('aria-label', ariaLabel);
    if (current) button.setAttribute('aria-current', 'page');
    if (!disabled && !current) button.addEventListener('click', () => {
      state.page = page;
      state.pageCorrectionUsed = false;
      loadList();
      try { root.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (error) { root.scrollIntoView(true); }
    });
    return button;
  };
  const pageSequence = (current, total) => {
    if (total <= 7) {
      const all = [];
      for (let page = 1; page <= total; page += 1) all.push(page);
      return all;
    }
    const values = [1, current - 1, current, current + 1, total].filter((page) => page >= 1 && page <= total);
    const unique = values.filter((page, index) => values.indexOf(page) === index).sort((a, b) => a - b);
    const output = [];
    unique.forEach((page, index) => {
      if (index && page - unique[index - 1] > 1) output.push(null);
      output.push(page);
    });
    return output;
  };
  const renderPagination = (total, pageSize) => {
    clear(pagination);
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (!config.showPagination || total <= pageSize) { pagination.hidden = true; return; }
    pagination.hidden = false;
    pagination.setAttribute('aria-label', text('pagination'));
    pagination.appendChild(createPageButton('←', state.page - 1, state.page <= 1, false, text('previous')));
    pageSequence(state.page, totalPages).forEach((page) => {
      if (page == null) {
        const ellipsis = document.createElement('span');
        ellipsis.className = 'news-page-ellipsis';
        ellipsis.textContent = '…';
        pagination.appendChild(ellipsis);
      } else {
        pagination.appendChild(createPageButton(String(page), page, false, page === state.page, String(page)));
      }
    });
    pagination.appendChild(createPageButton('→', state.page + 1, state.page >= totalPages, false, text('next')));
  };
  const loadList = () => {
    if (config.moduleType !== 'article' || config.type !== '1') {
      renderMessage(text('error'), false);
      return;
    }
    if (!readWebsiteId()) {
      renderMessage(text('error'), true);
      return;
    }
    const requestId = ++state.requestSeq;
    renderLoading();
    const data = {
      mold_types: config.type,
      page: state.page,
      page_size: config.pageSize,
      sort_by: config.sortBy,
      sort: config.sort,
      language_type: language
    };
    const catIds = currentQueryCatIds();
    if (catIds.length) data.cat_ids = catIds.join(',');
    if (state.keywords) data.keywords = state.keywords;
    request('/api/gatewayCms/articles/list', data).then((response) => {
      if (state.destroyed || requestId !== state.requestSeq) return;
      const normalized = unwrapResponse(response);
      if (normalized && normalized.code != null && Number(normalized.code) !== 0) throw new Error('API');
      const result = normalizeListResponse(normalized);
      state.total = result.total;
      const totalPages = Math.max(1, Math.ceil(result.total / result.pageSize));
      if (result.total > 0 && state.page > totalPages && !state.pageCorrectionUsed) {
        state.page = totalPages;
        state.pageCorrectionUsed = true;
        loadList();
        return;
      }
      state.page = result.currentPage;
      state.pageCorrectionUsed = false;
      if (!result.items.length) renderMessage(text('empty'), false); else renderItems(result.items);
      renderPagination(result.total, result.pageSize);
    }).catch(() => {
      if (state.destroyed || requestId !== state.requestSeq) return;
      renderMessage(text('error'), true);
    });
  };
  const initializeData = () => {
    renderLoading();
    return waitForWebsiteId(20).then((currentWebsiteId) => {
      if (!currentWebsiteId) { renderMessage(text('error'), true); return null; }
      return loadCategories().then(loadList);
    });
  };
  const onSearchSubmit = (event) => {
    event.preventDefault();
    const keywords = String(searchInput.value || '').trim();
    if (keywords === state.keywords) return;
    state.keywords = keywords;
    state.page = 1;
    state.pageCorrectionUsed = false;
    loadList();
  };

  searchForm.hidden = !config.showSearch;
  updateToolbarVisibility();
  searchInput.placeholder = text('search_placeholder');
  searchInput.setAttribute('aria-label', text('search_label'));
  searchButton.setAttribute('aria-label', text('search_label'));
  searchForm.addEventListener('submit', onSearchSubmit);
  initializeData();

  let removalObserver = null;
  if (typeof MutationObserver === 'function') {
    removalObserver = new MutationObserver(() => {
      if (document.documentElement.contains(root)) return;
      state.destroyed = true;
      state.requestSeq += 1;
      searchForm.removeEventListener('submit', onSearchSubmit);
      removalObserver.disconnect();
    });
    removalObserver.observe(document.documentElement, { childList: true, subtree: true });
  }
}());
</script>
