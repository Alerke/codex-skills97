  });
  const readEditorPreviewItems = () => {
    if (!previewData) return [];
    return Array.prototype.slice.call(previewData.querySelectorAll('[data-preview-item]')).map((node, index) => {
      const titleNode = node.querySelector('[data-preview-title]');
      const abstractNode = node.querySelector('[data-preview-abstract]');
      const configuredCover = normalizeImageConfig(node.getAttribute('data-preview-image'));
      return {
        id: '',
        title: titleNode ? String(titleNode.textContent || '').trim() : '',
        abstract: abstractNode ? String(abstractNode.textContent || '').trim() : '',
        cover: safeUrl(configuredCover, safeUrl(config.fallbackImage, '')),
        date: '',
        pcDetailLink: '',
        preview: true,
        previewIndex: index
      };
    }).filter((item) => item.title || item.abstract || item.cover);
  };
  const editorPreviewItems = readEditorPreviewItems();
  const useEditorPreview = isEditorContext && config.editorPreviewEnabled && editorPreviewItems.length > 0;
  const unwrapResponse = (response) => {
    let current = response;
    for (let depth = 0; depth < 3; depth += 1) {
      if (!current || typeof current !== 'object' || Array.isArray(current) || current.code != null) break;
      const nested = current.data;
      if (!nested || typeof nested !== 'object' || Array.isArray(nested)) break;
      if (nested.code == null && nested.msg == null && nested.data == null) break;
      current = nested;
    }
    return current;
  };
  const normalizeListResponse = (response) => {
    const normalized = unwrapResponse(response);
    const outer = normalized && normalized.data != null ? normalized.data : {};
    const items = Array.isArray(outer) ? outer : (Array.isArray(outer.data) ? outer.data : (Array.isArray(outer.list) ? outer.list : []));
    return items.map(normalizeItem);
  };
  const resolveRequestBridge = () => {
    const contexts = [window];
    if (window.parent && window.parent !== window) contexts.push(window.parent);
    if (window.top && contexts.indexOf(window.top) === -1) contexts.push(window.top);
    for (let index = 0; index < contexts.length; index += 1) {
      try {
        if (typeof contexts[index].r === 'function') return { context: contexts[index], request: contexts[index].r };
      } catch (error) { continue; }
    }
    return null;
  };
  const request = (url, data) => {
    const requestData = {};
    Object.keys(data || {}).forEach((key) => { requestData[key] = data[key]; });
    if (websiteId) requestData.website_id = websiteId;
    const bridge = resolveRequestBridge();
    if (bridge) {
      try {
        const result = bridge.request.call(bridge.context, url, requestData, 'GET');
        return Promise.resolve(result);
      } catch (error) { return Promise.reject(error); }
    }
    const query = Object.keys(requestData).filter((key) => requestData[key] !== '' && requestData[key] != null).map((key) => encodeURIComponent(key) + '=' + encodeURIComponent(requestData[key])).join('&');
    if (typeof window.fetch !== 'function') return Promise.reject(new Error('Fetch unavailable'));
    return window.fetch(url + (query ? '?' + query : ''), { credentials: 'same-origin' }).then((response) => {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    });
  };
  const normalizeCategoryNodes = (response) => {
    const normalized = unwrapResponse(response);
    const data = normalized && normalized.data;
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.data)) return data.data;
    return [];
  };
  const indexCategories = (nodes) => {
    const visit = (items) => (Array.isArray(items) ? items : []).forEach((item) => {
      if (!item || item.id == null) return;
      const id = String(item.id);
      const children = Array.isArray(item.children) ? item.children : [];
      state.categoryMap.set(id, { id: id, children: children });
      visit(children);
    });
    visit(nodes);
  };
  const expandCategory = (id, output) => {
    const key = String(id);
    if (output.indexOf(key) !== -1) return;
    output.push(key);
    const node = state.categoryMap.get(key);
    if (node) node.children.forEach((child) => { if (child && child.id != null) expandCategory(String(child.id), output); });
  };
  const loadCategories = () => {
    if (!config.catIds.length) { state.queryCatIds = []; return Promise.resolve(); }
    return request('/api/gatewayCms/articles/category', { mold_types: config.type, language_type: language }).then((response) => {
      indexCategories(normalizeCategoryNodes(response));
      const expanded = [];
      config.catIds.forEach((id) => expandCategory(id, expanded));
      state.queryCatIds = expanded;
    }).catch(() => { state.queryCatIds = config.catIds.slice(); });
  };
  const renderLoading = () => {
    clear(track);
    for (let index = 0; index < Math.min(3, config.pageSize); index += 1) {
      const skeleton = document.createElement('div');
      skeleton.className = 'news-skeleton';
      skeleton.setAttribute('aria-label', text('loading'));
      track.appendChild(skeleton);
    }
  };
  const renderMessage = (message, retry) => {
    clear(track);
    const status = document.createElement('div');
    status.className = 'news-status';
    status.textContent = message;
    if (retry) {
      const button = document.createElement('button');
      button.className = 'news-retry';
      button.type = 'button';
      button.textContent = text('retry');
      button.addEventListener('click', loadList);
      status.appendChild(button);
    }
    track.appendChild(status);
  };
  const renderItems = (items) => {
    clear(track);
    const fragment = document.createDocumentFragment();
    items.forEach((item) => {
      const article = document.createElement('article');
      article.className = 'news-card';
      const href = detailUrl(item);
      if (config.showThumbnail && item.cover) {
        const media = document.createElement(href ? 'a' : 'div');
        media.className = 'news-media';
        if (href) media.href = href;
        const image = document.createElement('img');
        image.className = 'news-image';
        image.src = safeUrl(item.cover, '');
        image.alt = item.title;
        image.loading = 'lazy';
        media.appendChild(image);
        article.appendChild(media);
      }
      const title = document.createElement('h3');
      title.className = 'news-card-title';
      const titleContent = document.createElement(href ? 'a' : 'span');
      if (href) titleContent.href = href;
      titleContent.textContent = item.title;
      title.appendChild(titleContent);
      article.appendChild(title);
      if (config.showAbstract && item.abstract) {
        const abstract = document.createElement('p');
        abstract.className = 'news-abstract';
        abstract.textContent = item.abstract;
        article.appendChild(abstract);
      }
      if (config.showDate && item.date) {
        const date = document.createElement('time');
        date.className = 'news-date';
        date.textContent = item.date;
        article.appendChild(date);
      }
      if (config.showCardArrow && (href || item.preview)) {
        const cardArrow = document.createElement(href ? 'a' : 'span');
        cardArrow.className = 'news-card-link' + (item.preview ? ' news-preview-arrow' : '');
        if (href) {
          cardArrow.href = href;
          cardArrow.setAttribute('aria-label', text('read_more') + '：' + item.title);
        } else {
          cardArrow.setAttribute('aria-hidden', 'true');
        }
        cardArrow.innerHTML = arrowSvg();
        article.appendChild(cardArrow);
      }
      fragment.appendChild(article);
    });
    track.appendChild(fragment);
  };
  const visibleColumns = () => {
    const width = root.getBoundingClientRect().width;
    if (width <= 576) return parseNumber(getComputedStyle(root).getPropertyValue('--news-mobile-columns'), 1, 1, 2);
    if (width <= 1024) return parseNumber(getComputedStyle(root).getPropertyValue('--news-tablet-columns'), 2, 1, 3);
    return parseNumber(getComputedStyle(root).getPropertyValue('--news-columns'), 3, 1, 6);
  };
  const updateSlider = () => {
    const cards = track.querySelectorAll('.news-card');
    const columns = visibleColumns();
    const gap = parseNumber(getComputedStyle(track).columnGap || getComputedStyle(track).gap, 20, 0, 200);
    const viewportWidth = viewport ? viewport.getBoundingClientRect().width : 0;
    const cardWidth = viewportWidth > 0 ? Math.max(0, (viewportWidth - gap * (columns - 1)) / columns) : 0;
    if (cardWidth > 0) track.style.setProperty('--news-card-width', cardWidth + 'px');
    const maxIndex = Math.max(0, cards.length - columns);
    state.index = Math.max(0, Math.min(state.index, maxIndex));
    let offset = 0;
    if (cards.length && state.index > 0) {
      const measuredWidth = cards[0].getBoundingClientRect().width;
      offset = state.index * (measuredWidth + gap);
    }
    track.style.transform = 'translate3d(-' + offset + 'px,0,0)';
    previousButton.disabled = state.index <= 0;
    nextButton.disabled = state.index >= maxIndex;
  };
  const moveSlider = (direction) => {
    state.index += direction;
    updateSlider();
  };
  const onViewportKeydown = (event) => {
    const key = event && (event.key || event.keyCode);
    if (key === 'ArrowLeft' || key === 37) {
      event.preventDefault();
      moveSlider(-1);
    } else if (key === 'ArrowRight' || key === 39) {
      event.preventDefault();
      moveSlider(1);
    }
  };
  const onTouchStart = (event) => {
    const touch = event && event.touches && event.touches[0];
    state.touchStartX = touch ? touch.clientX : null;
    state.touchMoved = false;
  };
  const onTouchMove = (event) => {
    const touch = event && event.touches && event.touches[0];
    if (!touch || state.touchStartX == null) return;
    if (Math.abs(touch.clientX - state.touchStartX) > 10) state.touchMoved = true;
  };
  const onTouchEnd = (event) => {
    const touch = event && event.changedTouches && event.changedTouches[0];
    if (!touch || state.touchStartX == null) return;
    const distance = touch.clientX - state.touchStartX;
    state.touchStartX = null;
    if (Math.abs(distance) >= 42) moveSlider(distance < 0 ? 1 : -1);
    if (state.touchResetTimer) window.clearTimeout(state.touchResetTimer);
    state.touchResetTimer = window.setTimeout(() => { state.touchMoved = false; }, 350);
  };
  const onSwipeClick = (event) => {
    if (!state.touchMoved) return;
    event.preventDefault();
    event.stopPropagation();
  };
  const loadList = () => {
    if (config.moduleType !== 'article' || !/^(1|2|12|19|11|10|6|5|7|8)$/.test(config.type)) {
      renderMessage(text('error'), false);
      return;
    }
    const requestId = ++state.requestSeq;
    if (!useEditorPreview) renderLoading();
    const data = { mold_types: config.type, page: 1, page_size: config.pageSize, sort_by: config.sortBy, sort: config.sort, language_type: language };
    if (state.queryCatIds.length) data.cat_ids = state.queryCatIds.join(',');
    request('/api/gatewayCms/articles/list', data).then((response) => {
      if (state.destroyed || requestId !== state.requestSeq) return;
      const normalizedResponse = unwrapResponse(response);
      if (normalizedResponse && normalizedResponse.code != null && Number(normalizedResponse.code) !== 0) throw new Error('API');
      const items = normalizeListResponse(normalizedResponse);
      state.items = items;
      state.index = 0;
      if (!items.length) {
        if (useEditorPreview) renderItems(editorPreviewItems); else renderMessage(text('empty'), false);
      } else {
        renderItems(items);
      }
      updateSlider();
    }).catch(() => {
      if (state.destroyed || requestId !== state.requestSeq) return;
      if (useEditorPreview) renderItems(editorPreviewItems); else renderMessage(text('error'), true);
      updateSlider();
    });
  };

  allNewsLink.style.display = config.showAllNews ? '' : 'none';
  if (!config.showArrows) { previousButton.style.display = 'none'; nextButton.style.display = 'none'; }
  const configuredHref = safeUrl(allNewsLink.getAttribute('href'), '/news');
  const configuredTarget = allNewsLink.getAttribute('target');
  allNewsLink.href = configuredHref;
  allNewsLink.target = configuredTarget === '_blank' ? '_blank' : '_self';
  if (allNewsLink.target === '_blank') allNewsLink.rel = 'noopener noreferrer';
  const stopJump = (event) => {
    if (!event) return;
    event.preventDefault();
    event.stopPropagation();
  };
  previousButton.addEventListener('click', (event) => {
    stopJump(event);
    moveSlider(-1);
  });
  nextButton.addEventListener('click', (event) => {
    stopJump(event);
    moveSlider(1);
  });
  if (viewport) {
    viewport.addEventListener('keydown', onViewportKeydown);
    viewport.addEventListener('touchstart', onTouchStart, false);
    viewport.addEventListener('touchmove', onTouchMove, false);
    viewport.addEventListener('touchend', onTouchEnd, false);
    viewport.addEventListener('click', onSwipeClick, true);
  }
  window.addEventListener('resize', updateSlider);
  let removalObserver = null;
  if (typeof MutationObserver === 'function') {
    removalObserver = new MutationObserver(() => {
      if (document.documentElement.contains(root)) return;
      state.destroyed = true;
      state.requestSeq += 1;
      if (state.touchResetTimer) window.clearTimeout(state.touchResetTimer);
      if (viewport) {
        viewport.removeEventListener('keydown', onViewportKeydown);
        viewport.removeEventListener('touchstart', onTouchStart, false);
        viewport.removeEventListener('touchmove', onTouchMove, false);
        viewport.removeEventListener('touchend', onTouchEnd, false);
        viewport.removeEventListener('click', onSwipeClick, true);
      }
      window.removeEventListener('resize', updateSlider);
      removalObserver.disconnect();
    });
    removalObserver.observe(document.documentElement, { childList: true, subtree: true });
  }
  if (useEditorPreview) {
    renderItems(editorPreviewItems);
    updateSlider();
  } else {
    renderLoading();
  }
  loadCategories().then(loadList);
}());
</script>
