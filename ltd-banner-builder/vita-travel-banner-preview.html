      kind: 'image',

      hasExplicitTitle: !!explicitTitle,
      subtitle: readText(item.subtitle) || readText(item.desc) || readText(item.description),
      buttonText: readText(item.button_text) || readText(item.cta_text) || (explicitTitle ? name : ''),
      jump: normalizeJump(item),
      button_background_start: readText(item.button_background_start),
      button_background_end: readText(item.button_background_end),
      button_text_color: readText(item.button_text_color),
      button_border_start: readText(item.button_border_start),
      button_border_end: readText(item.button_border_end),
      button_border_width: readText(item.button_border_width),

  const normalizeVideos = (value) =&gt; parseList(value, []).reduce((items, item) =&gt; {
    if (!item || typeof item !== 'object' || Array.isArray(item) || isHidden(item.hidden)) return items;
    const url = pickUrl(item, ['url', 'filepath', 'src']);

      subtitle: readText(item.subtitle) || readText(item.description) || readText(item.desc),
      buttonText: readText(item.button_text) || readText(item.cta_text) || (explicitTitle ? name : ''),
      autoplay: autoplay,
      controls: readSwitch(item.controls, false),
      muted: autoplay ? true : readSwitch(item.muted, true),
      jump: normalizeJump(item),
      button_background_start: readText(item.button_background_start),
      button_background_end: readText(item.button_background_end),
      button_text_color: readText(item.button_text_color),
      button_border_start: readText(item.button_border_start),

  }, []);

  const parseRatio = (value, fallback) =&gt; {
    const text = readText(value).replace(/[：／∶]/g, '/').replace(':', '/');
    const parts = text.split('/');
    let width;
    let height;
    if (parts.length === 2) {
      width = Number(parts[0]);
      height = Number(parts[1]);
    } else {
      width = Number(text);
      height = 1;
    }
    const ratio = width / height;
    if (!Number.isFinite(width) || !Number.isFinite(height) || width &lt;= 0 || height &lt;= 0 || ratio &lt; .25 || ratio &gt; 6) return fallback;

  };

  const validColor = (value, fallback) =&gt; {
    const color = readText(value);
    if (!color || !window.CSS || typeof window.CSS.supports !== 'function') return /^#(?:[\da-f]{3}|[\da-f]{6}|[\da-f]{8})$/i.test(color) ? color : fallback;

  };

  const readItemValue = (item, keys) =&gt; {
    for (let index = 0; index &lt; keys.length; index += 1) {

      if (value) return value;
    }
    return '';
  };

  const dataset = root.dataset;
  const mediaType = readEnum(dataset.mediaType, ['image', 'video'], 'image');
  const autoplayEnabled = readSwitch(dataset.autoplay, true);

  const titleSize = readNumber(dataset.titleFontSize, 120, 16, 120);

  const titleWeight = readNumber(dataset.titleFontWeight, 600, 100, 900);
  const overlayOpacity = readNumber(dataset.overlayOpacity, .28, 0, 1);
  const contentBottom = readNumber(dataset.contentBottom, 105, 0, 1000);
  const contentLeft = readNumber(dataset.contentLeft, 0, 0, 1000);
  const mobileRatioMode = readSwitch(dataset.mobileRatioMode, false);
  const pcRatioMode = readSwitch(dataset.pcRatioMode, false);
  const showOverlay = readSwitch(dataset.showOverlay, true);
  const inheritFirstContent = readSwitch(dataset.inheritFirstContent, true);
  const pcRatio = parseRatio(dataset.pcAspectRatio, { css: '16 / 9', value: 16 / 9 });

  const reducedMotion = window.matchMedia &amp;&amp; window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const saveData = navigator.connection &amp;&amp; navigator.connection.saveData === true;
  const activeItems = mediaType === 'video' ? normalizeVideos(rawVideoSlides) : normalizeImages(rawSlides);

  root.dataset.mediaType = mediaType;
  root.dataset.autoplay = autoplayEnabled ? '1' : '0';
  root.dataset.mobileRatioMode = mobileRatioMode ? '1' : '0';
  root.dataset.pcRatioMode = pcRatioMode ? '1' : '0';

  root.style.setProperty('--ltd-banner-pc-aspect-ratio', pcRatio.css);
  root.style.setProperty('--ltd-banner-mobile-aspect-ratio', mobileRatio.css);

  const globalButtonStyle = {
    backgroundStart: validColor(dataset.buttonBackgroundStart, '#ffffff'),

    borderStart: validColor(dataset.buttonBorderStart, '#ffffff'),
    borderEnd: validColor(dataset.buttonBorderEnd, '#ffffff'),

  for (let variableIndex = 0; variableIndex &lt; activeItems.length &amp;&amp; variableIndex &lt; slideVariableContent.length; variableIndex += 1) {

    if (variableContent.subtitle) variableItem.subtitle = variableContent.subtitle;

    if (variableContent.buttonHoverBorderStart) variableItem.button_hover_border_start = variableContent.buttonHoverBorderStart;
    if (variableContent.buttonHoverBorderEnd) variableItem.button_hover_border_end = variableContent.buttonHoverBorderEnd;
  }

  const applyButtonStyle = (link, item) =&gt; {
    const setColor = (property, keys, fallback) =&gt; link.style.setProperty(property, validColor(readItemValue(item, keys), fallback));
    setColor('--ltd-banner-button-bg-start', ['button_background_start', 'button_bg_start'], globalButtonStyle.backgroundStart);
    setColor('--ltd-banner-button-bg-end', ['button_background_end', 'button_bg_end'], globalButtonStyle.backgroundEnd);
    setColor('--ltd-banner-button-text', ['button_text_color', 'button_color'], globalButtonStyle.textColor);
    setColor('--ltd-banner-button-border-start', ['button_border_start', 'button_gradient_start'], globalButtonStyle.borderStart);
    setColor('--ltd-banner-button-border-end', ['button_border_end', 'button_gradient_end'], globalButtonStyle.borderEnd);
    setColor('--ltd-banner-button-hover-bg-start', ['button_hover_background_start', 'button_hover_bg_start'], globalButtonStyle.hoverBackgroundStart);
    setColor('--ltd-banner-button-hover-bg-end', ['button_hover_background_end', 'button_hover_bg_end'], globalButtonStyle.hoverBackgroundEnd);
    setColor('--ltd-banner-button-hover-text', ['button_hover_text_color', 'button_hover_color'], globalButtonStyle.hoverTextColor);
    setColor('--ltd-banner-button-hover-border-start', ['button_hover_border_start', 'button_hover_gradient_start'], globalButtonStyle.hoverBorderStart);
    setColor('--ltd-banner-button-hover-border-end', ['button_hover_border_end', 'button_hover_gradient_end'], globalButtonStyle.hoverBorderEnd);
    link.style.setProperty('--ltd-banner-button-border-width', readNumber(readItemValue(item, ['button_border_width']), globalButtonStyle.borderWidth, 0, 12) + 'px');
    link.style.setProperty('--ltd-banner-button-gradient-angle', readNumber(readItemValue(item, ['button_gradient_angle']), globalButtonStyle.gradientAngle, 0, 360) + 'deg');
    link.style.setProperty('--ltd-banner-button-hover-scale', String(readNumber(readItemValue(item, ['button_hover_scale']), globalButtonStyle.hoverScale, 1, 1.2)));
    link.style.setProperty('--ltd-banner-button-hover-lift', readNumber(readItemValue(item, ['button_hover_lift']), globalButtonStyle.hoverLift, -20, 0) + 'px');
    link.style.setProperty('--ltd-banner-button-flow-duration', readNumber(readItemValue(item, ['button_flow_duration']), globalButtonStyle.flowDuration, 1, 20) + 's');
  };

  const createContent = (item) =&gt; {
    const content = document.createElement('div');
    content.className = 'ltd-banner-content';
    if (item.title_color) content.style.setProperty('--ltd-banner-text-color', validColor(item.title_color, validColor(dataset.textColor, '#ffffff')));
    if (item.subtitle_color) content.style.setProperty('--ltd-banner-subtitle-color', validColor(item.subtitle_color, validColor(dataset.subtitleColor, '#ffffff')));

  };

  activeItems.forEach((item, index) =&gt; {
    const slide = document.createElement('div');
    const overlay = document.createElement('div');
    slide.className = 'swiper-slide' + (index === 0 ? ' ltd-banner-active' : '');

    } else {

      image.alt = item.alt;
      image.loading = index === 0 ? 'eager' : 'lazy';
      image.decoding = 'async';

    slide.appendChild(overlay);
    slide.appendChild(createContent(item));
    wrapper.appendChild(slide);
  });

  const pad2 = (value) =&gt; value &lt; 10 ? '0' + value : String(value);
  const setActive = (index) =&gt; {
    const slides = wrapper.querySelectorAll('.swiper-slide');
    for (let slideIndex = 0; slideIndex &lt; slides.length; slideIndex += 1) {

    }
    currentNode.textContent = pad2(index + 1);
  };

  const pauseVideos = () =&gt; {
    const videos = root.querySelectorAll('video');
    for (let index = 0; index &lt; videos.length; index += 1) videos[index].pause();
  };

  const playActiveVideo = () =&gt; {
    pauseVideos();
    if (mediaType !== 'video' || reducedMotion || saveData || document.hidden) return;
    const activeSlide = root.querySelector('.swiper-slide-active') || root.querySelector('.ltd-banner-active');
    const video = activeSlide ? activeSlide.querySelector('video') : null;

  const stopProgress = () =&gt; {

    progressFrame = 0;
  };

  const startProgressFallback = () =&gt; {
    stopProgress();
    if (!autoplayEnabled || reducedMotion || activeItems.length &lt; 2) {

    const tick = () =&gt; {

  };

  const bindVideoEndings = () =&gt; {

    for (let index = 0; index &lt; videos.length; index += 1) {

        if (swiper &amp;&amp; autoplayEnabled &amp;&amp; activeItems.length &gt; 1 &amp;&amp; typeof swiper.slideNext === 'function') swiper.slideNext();

      setActive(0);
      playActiveVideo();
    }

  const waitForSwiper = (attempt) =&gt; {

      return;
    }
    if (attempt &gt;= 20) {

      progress.hidden = true;

  const supportsAspectRatio = window.CSS &amp;&amp; typeof window.CSS.supports === 'function' &amp;&amp; window.CSS.supports('aspect-ratio', '16 / 9');

    if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
    resizeFrame = window.requestAnimationFrame(updateFallbackHeight);
  };

      playActiveVideo();

  };

  const handleFocusIn = () =&gt; {
    if (swiper &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.stop === 'function') swiper.autoplay.stop();
  };

  const handleFocusOut = () =&gt; {
    if (swiper &amp;&amp; autoplayEnabled &amp;&amp; !reducedMotion &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.start === 'function') swiper.autoplay.start();
  };

  root._ltdBannerCleanup = () =&gt; {
    destroyed = true;
    if (retryTimer) window.clearTimeout(retryTimer);
    if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
    stopProgress();
    pauseVideos();

    }

      jump: normalizeJump(item),
      button_background_start: readText(item.button_background_start),
      button_background_end: readText(item.button_background_end),
      button_text_color: readText(item.button_text_color),
      button_border_start: readText(item.button_border_start),
      button_border_end: readText(item.button_border_end),
      button_border_width: readText(item.button_border_width),

  const normalizeVideos = (value) =&gt; parseList(value, []).reduce((items, item) =&gt; {

  const parseRatio = (value, fallback) =&gt; {
    const text = readText(value).replace(/[：／∶]/g, '/').replace(':', '/');
    const parts = text.split('/');
    let width;
    let height;
    if (parts.length === 2) {
      width = Number(parts[0]);
      height = Number(parts[1]);
    } else {
      width = Number(text);
      height = 1;
    }
    const ratio = width / height;
    if (!Number.isFinite(width) || !Number.isFinite(height) || width &lt;= 0 || height &lt;= 0 || ratio &lt; .25 || ratio &gt; 6) return fallback;

  const validColor = (value, fallback) =&gt; {

  const readItemValue = (item, keys) =&gt; {

  const dataset = root.dataset;

  const contentLeft = readNumber(dataset.contentLeft, 0, 0, 1000);

  const showOverlay = readSwitch(dataset.showOverlay, true);

  root.dataset.mediaType = mediaType;
  root.dataset.autoplay = autoplayEnabled ? '1' : '0';
  root.dataset.mobileRatioMode = mobileRatioMode ? '1' : '0';

  const globalButtonStyle = {

  }

  const applyButtonStyle = (link, item) =&gt; {
    const setColor = (property, keys, fallback) =&gt; link.style.setProperty(property, validColor(readItemValue(item, keys), fallback));
    setColor('--ltd-banner-button-bg-start', ['button_background_start', 'button_bg_start'], globalButtonStyle.backgroundStart);
    setColor('--ltd-banner-button-bg-end', ['button_background_end', 'button_bg_end'], globalButtonStyle.backgroundEnd);

    setColor('--ltd-banner-button-border-start', ['button_border_start', 'button_gradient_start'], globalButtonStyle.borderStart);
    setColor('--ltd-banner-button-border-end', ['button_border_end', 'button_gradient_end'], globalButtonStyle.borderEnd);
    setColor('--ltd-banner-button-hover-bg-start', ['button_hover_background_start', 'button_hover_bg_start'], globalButtonStyle.hoverBackgroundStart);
    setColor('--ltd-banner-button-hover-bg-end', ['button_hover_background_end', 'button_hover_bg_end'], globalButtonStyle.hoverBackgroundEnd);
    setColor('--ltd-banner-button-hover-text', ['button_hover_text_color', 'button_hover_color'], globalButtonStyle.hoverTextColor);
    setColor('--ltd-banner-button-hover-border-start', ['button_hover_border_start', 'button_hover_gradient_start'], globalButtonStyle.hoverBorderStart);
    setColor('--ltd-banner-button-hover-border-end', ['button_hover_border_end', 'button_hover_gradient_end'], globalButtonStyle.hoverBorderEnd);
    link.style.setProperty('--ltd-banner-button-border-width', readNumber(readItemValue(item, ['button_border_width']), globalButtonStyle.borderWidth, 0, 12) + 'px');
    link.style.setProperty('--ltd-banner-button-gradient-angle', readNumber(readItemValue(item, ['button_gradient_angle']), globalButtonStyle.gradientAngle, 0, 360) + 'deg');
    link.style.setProperty('--ltd-banner-button-hover-scale', String(readNumber(readItemValue(item, ['button_hover_scale']), globalButtonStyle.hoverScale, 1, 1.2)));

  const createContent = (item) =&gt; {

  activeItems.forEach((item, index) =&gt; {

  });

  const pad2 = (value) =&gt; value &lt; 10 ? '0' + value : String(value);
  const setActive = (index) =&gt; {

  };

  const pauseVideos = () =&gt; {
    const videos = root.querySelectorAll('video');

  };

  const playActiveVideo = () =&gt; {
    pauseVideos();
    if (mediaType !== 'video' || reducedMotion || saveData || document.hidden) return;

  };

    const urls = collectUrls(item, ['url', 'image', 'filepath', 'filePath', 'file_path', 'src', 'filepath_thumb', 'filePathThumb', 'thumbnail', 'thumb']);
    if (!urls.length) return items;
    const explicitTitle = readText(item.title);
    const name = readText(item.name);
    items.push({
      kind: 'image',
      url: urls[0],
      urls: urls,
      alt: readText(item.alt) || name || explicitTitle,
      title: explicitTitle || name,
      hasExplicitTitle: !!explicitTitle,
      subtitle: readText(item.subtitle) || readText(item.desc) || readText(item.description),
      buttonText: readText(item.button_text) || readText(item.cta_text) || (explicitTitle ? name : ''),
      jump: normalizeJump(item),
      button_background_start: readText(item.button_background_start),
      button_background_end: readText(item.button_background_end),
      button_text_color: readText(item.button_text_color),
      button_border_start: readText(item.button_border_start),
      button_border_end: readText(item.button_border_end),
      button_border_width: readText(item.button_border_width),
      button_gradient_angle: readText(item.button_gradient_angle),
      button_hover_background_start: readText(item.button_hover_background_start),
      button_hover_background_end: readText(item.button_hover_background_end),
      button_hover_text_color: readText(item.button_hover_text_color),
      button_hover_border_start: readText(item.button_hover_border_start),
      button_hover_border_end: readText(item.button_hover_border_end),
      button_hover_scale: readText(item.button_hover_scale),
      button_hover_lift: readText(item.button_hover_lift),
      button_flow_duration: readText(item.button_flow_duration)
    });
    return items;
  }, []);

  const normalizeVideos = (value) =&gt; parseList(value, []).reduce((items, item) =&gt; {
    if (!item || typeof item !== 'object' || Array.isArray(item) || isHidden(item.hidden)) return items;
    const url = pickUrl(item, ['url', 'filepath', 'src']);
    if (!url) return items;
    const explicitTitle = readText(item.title);
    const name = readText(item.name);
    const autoplay = readSwitch(item.autoplay, false);
    items.push({
      kind: 'video',
      url: url,
      poster: pickUrl(item, ['poster', 'cover', 'image', 'filepath_thumb']),
      title: explicitTitle || name,
      hasExplicitTitle: !!explicitTitle,
      subtitle: readText(item.subtitle) || readText(item.description) || readText(item.desc),
      buttonText: readText(item.button_text) || readText(item.cta_text) || (explicitTitle ? name : ''),
      autoplay: autoplay,
      controls: readSwitch(item.controls, false),
      muted: autoplay ? true : readSwitch(item.muted, true),
      jump: normalizeJump(item),
      button_background_start: readText(item.button_background_start),
      button_background_end: readText(item.button_background_end),
      button_text_color: readText(item.button_text_color),
      button_border_start: readText(item.button_border_start),
      button_border_end: readText(item.button_border_end),
      button_border_width: readText(item.button_border_width),
      button_gradient_angle: readText(item.button_gradient_angle),
      button_hover_background_start: readText(item.button_hover_background_start),
      button_hover_background_end: readText(item.button_hover_background_end),
      button_hover_text_color: readText(item.button_hover_text_color),
      button_hover_border_start: readText(item.button_hover_border_start),
      button_hover_border_end: readText(item.button_hover_border_end),
      button_hover_scale: readText(item.button_hover_scale),
      button_hover_lift: readText(item.button_hover_lift),
      button_flow_duration: readText(item.button_flow_duration)
    });
    return items;
  }, []);

  const parseRatio = (value, fallback) =&gt; {
    const text = readText(value).replace(/[：／∶]/g, '/').replace(':', '/');
    const parts = text.split('/');
    let width;
    let height;
    if (parts.length === 2) {
      width = Number(parts[0]);
      height = Number(parts[1]);
    } else {
      width = Number(text);
      height = 1;
    }
    const ratio = width / height;
    if (!Number.isFinite(width) || !Number.isFinite(height) || width &lt;= 0 || height &lt;= 0 || ratio &lt; .25 || ratio &gt; 6) return fallback;
    return { css: width + ' / ' + height, value: ratio };
  };

  const validColor = (value, fallback) =&gt; {
    const color = readText(value);
    if (!color || !window.CSS || typeof window.CSS.supports !== 'function') return /^#(?:[\da-f]{3}|[\da-f]{6}|[\da-f]{8})$/i.test(color) ? color : fallback;
    return window.CSS.supports('color', color) ? color : fallback;
  };

  const readItemValue = (item, keys) =&gt; {
    for (let index = 0; index &lt; keys.length; index += 1) {
      const value = readText(item &amp;&amp; item[keys[index]]);
      if (value) return value;
    }
    return '';
  };

  const dataset = root.dataset;
  const mediaType = readEnum(dataset.mediaType, ['image', 'video'], 'image');
  const autoplayEnabled = readSwitch(dataset.autoplay, true);
  const autoplayDelay = readNumber(dataset.autoplayDelay, 6000, 1500, 20000);
  const titleSize = readNumber(dataset.titleFontSize, 120, 16, 120);
  const subtitleSize = readNumber(dataset.subtitleFontSize, 25, 10, 60);
  const titleWeight = readNumber(dataset.titleFontWeight, 600, 100, 900);
  const overlayOpacity = readNumber(dataset.overlayOpacity, .28, 0, 1);
  const contentBottom = readNumber(dataset.contentBottom, 105, 0, 1000);
  const contentLeft = readNumber(dataset.contentLeft, 0, 0, 1000);
  const mobileRatioMode = readSwitch(dataset.mobileRatioMode, false);
  const pcRatioMode = readSwitch(dataset.pcRatioMode, false);
  const showOverlay = readSwitch(dataset.showOverlay, true);
  const inheritFirstContent = readSwitch(dataset.inheritFirstContent, true);
  const pcRatio = parseRatio(dataset.pcAspectRatio, { css: '16 / 9', value: 16 / 9 });
  const mobileRatio = parseRatio(dataset.mobileAspectRatio, { css: '4 / 5', value: 4 / 5 });
  const reducedMotion = window.matchMedia &amp;&amp; window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const saveData = navigator.connection &amp;&amp; navigator.connection.saveData === true;
  const activeItems = mediaType === 'video' ? normalizeVideos(rawVideoSlides) : normalizeImages(rawSlides);

  root.dataset.mediaType = mediaType;
  root.dataset.autoplay = autoplayEnabled ? '1' : '0';
  root.dataset.mobileRatioMode = mobileRatioMode ? '1' : '0';
  root.dataset.pcRatioMode = pcRatioMode ? '1' : '0';
  root.dataset.showOverlay = showOverlay ? '1' : '0';
  root.style.setProperty('--ltd-banner-title-size', titleSize + 'px');
  root.style.setProperty('--ltd-banner-title-size-lg', Math.min(titleSize, 104) + 'px');
  root.style.setProperty('--ltd-banner-title-size-tablet', Math.min(titleSize, 80) + 'px');
  root.style.setProperty('--ltd-banner-title-size-md', Math.min(titleSize, 62) + 'px');
  root.style.setProperty('--ltd-banner-title-size-sm', Math.min(titleSize, 48) + 'px');
  root.style.setProperty('--ltd-banner-subtitle-size', subtitleSize + 'px');
  root.style.setProperty('--ltd-banner-subtitle-size-md', Math.min(subtitleSize, 20) + 'px');
  root.style.setProperty('--ltd-banner-subtitle-size-sm', Math.min(subtitleSize, 17) + 'px');
  root.style.setProperty('--ltd-banner-title-weight', String(titleWeight));
  root.style.setProperty('--ltd-banner-text-color', validColor(dataset.textColor, '#ffffff'));
  root.style.setProperty('--ltd-banner-subtitle-color', validColor(dataset.subtitleColor, '#ffffff'));
  root.style.setProperty('--ltd-banner-overlay-opacity', String(overlayOpacity));
  root.style.setProperty('--ltd-banner-content-bottom', contentBottom + 'px');
  root.style.setProperty('--ltd-banner-content-left', contentLeft + 'px');
  root.style.setProperty('--ltd-banner-content-bottom-tablet', Math.min(contentBottom, 72) + 'px');
  root.style.setProperty('--ltd-banner-content-left-tablet', Math.min(contentLeft, 80) + 'px');
  root.style.setProperty('--ltd-banner-pc-aspect-ratio', pcRatio.css);
  root.style.setProperty('--ltd-banner-mobile-aspect-ratio', mobileRatio.css);

  const globalButtonStyle = {
    backgroundStart: validColor(dataset.buttonBackgroundStart, '#ffffff'),
    backgroundEnd: validColor(dataset.buttonBackgroundEnd, '#ffffff'),
    textColor: validColor(dataset.buttonTextColor, '#08292f'),
    borderStart: validColor(dataset.buttonBorderStart, '#ffffff'),
    borderEnd: validColor(dataset.buttonBorderEnd, '#ffffff'),
    borderWidth: readNumber(dataset.buttonBorderWidth, 2, 0, 12),
    gradientAngle: readNumber(dataset.buttonGradientAngle, 120, 0, 360),
    hoverBackgroundStart: validColor(dataset.buttonHoverBackgroundStart, '#eaf4f2'),
    hoverBackgroundEnd: validColor(dataset.buttonHoverBackgroundEnd, '#ffffff'),
    hoverTextColor: validColor(dataset.buttonHoverTextColor, '#08292f'),
    hoverBorderStart: validColor(dataset.buttonHoverBorderStart, '#75d5cc'),
    hoverBorderEnd: validColor(dataset.buttonHoverBorderEnd, '#f3bc75'),
    hoverScale: readNumber(dataset.buttonHoverScale, 1.03, 1, 1.2),
    hoverLift: readNumber(dataset.buttonHoverLift, -2, -20, 0),
    flowDuration: readNumber(dataset.buttonFlowDuration, 4, 1, 20)
  };

  const readDatasetJump = (value, fallback) =&gt; {
    const href = readText(value);
    if (!href) return fallback;
    return isSafeMediaUrl(href) ? { href: href, target: '_self' } : fallback;
  };

  const slideVariableContent = [1, 2, 3].map((number) =&gt; {
    const prefix = 'slide' + number;
    return {
      title: readText(dataset[prefix + 'Title']),
      subtitle: readText(dataset[prefix + 'Subtitle']),
      buttonText: readText(dataset[prefix + 'ButtonText']),
      buttonUrl: readText(dataset[prefix + 'ButtonUrl']),
      titleColor: readText(dataset[prefix + 'TitleColor']),
      subtitleColor: readText(dataset[prefix + 'SubtitleColor']),
      buttonBackground: readText(dataset[prefix + 'ButtonBackground']),
      buttonTextColor: readText(dataset[prefix + 'ButtonTextColor']),
      buttonBorderStart: readText(dataset[prefix + 'ButtonBorderStart']),
      buttonBorderEnd: readText(dataset[prefix + 'ButtonBorderEnd']),
      buttonHoverBackground: readText(dataset[prefix + 'ButtonHoverBackground']),
      buttonHoverTextColor: readText(dataset[prefix + 'ButtonHoverTextColor']),
      buttonHoverBorderStart: readText(dataset[prefix + 'ButtonHoverBorderStart']),
      buttonHoverBorderEnd: readText(dataset[prefix + 'ButtonHoverBorderEnd'])
    };
  });

  const firstVariableContent = slideVariableContent[0];
  const firstContent = activeItems.length ? {
    title: firstVariableContent.title || activeItems[0].title,
    subtitle: firstVariableContent.subtitle || activeItems[0].subtitle,
    buttonText: firstVariableContent.buttonText || activeItems[0].buttonText,
    jump: readDatasetJump(firstVariableContent.buttonUrl, activeItems[0].jump)
  } : { title: '', subtitle: '', buttonText: '', jump: null };

  const completeItem = (item) =&gt; {
    if (!inheritFirstContent || item === activeItems[0]) return item;
    if (!item.hasExplicitTitle) item.title = firstContent.title;
    if (!item.subtitle) item.subtitle = firstContent.subtitle;
    if (!item.buttonText) item.buttonText = firstContent.buttonText;
    if (!item.jump) item.jump = firstContent.jump;
    return item;
  };

  for (let itemIndex = 0; itemIndex &lt; activeItems.length; itemIndex += 1) completeItem(activeItems[itemIndex]);

  for (let variableIndex = 0; variableIndex &lt; activeItems.length &amp;&amp; variableIndex &lt; slideVariableContent.length; variableIndex += 1) {
    const variableContent = slideVariableContent[variableIndex];
    const variableItem = activeItems[variableIndex];
    if (variableContent.title) variableItem.title = variableContent.title;
    if (variableContent.subtitle) variableItem.subtitle = variableContent.subtitle;
    if (variableContent.buttonText) variableItem.buttonText = variableContent.buttonText;
    variableItem.jump = readDatasetJump(variableContent.buttonUrl, variableItem.jump);
    if (variableContent.titleColor) variableItem.title_color = variableContent.titleColor;
    if (variableContent.subtitleColor) variableItem.subtitle_color = variableContent.subtitleColor;
    if (variableContent.buttonBackground) {
      variableItem.button_background_start = variableContent.buttonBackground;
      variableItem.button_background_end = variableContent.buttonBackground;
    }
    if (variableContent.buttonTextColor) variableItem.button_text_color = variableContent.buttonTextColor;
    if (variableContent.buttonBorderStart) variableItem.button_border_start = variableContent.buttonBorderStart;
    if (variableContent.buttonBorderEnd) variableItem.button_border_end = variableContent.buttonBorderEnd;
    if (variableContent.buttonHoverBackground) {
      variableItem.button_hover_background_start = variableContent.buttonHoverBackground;
      variableItem.button_hover_background_end = variableContent.buttonHoverBackground;
    }
    if (variableContent.buttonHoverTextColor) variableItem.button_hover_text_color = variableContent.buttonHoverTextColor;
    if (variableContent.buttonHoverBorderStart) variableItem.button_hover_border_start = variableContent.buttonHoverBorderStart;
    if (variableContent.buttonHoverBorderEnd) variableItem.button_hover_border_end = variableContent.buttonHoverBorderEnd;
  }

  const applyButtonStyle = (link, item) =&gt; {
    const setColor = (property, keys, fallback) =&gt; link.style.setProperty(property, validColor(readItemValue(item, keys), fallback));
    setColor('--ltd-banner-button-bg-start', ['button_background_start', 'button_bg_start'], globalButtonStyle.backgroundStart);
    setColor('--ltd-banner-button-bg-end', ['button_background_end', 'button_bg_end'], globalButtonStyle.backgroundEnd);
    setColor('--ltd-banner-button-text', ['button_text_color', 'button_color'], globalButtonStyle.textColor);
    setColor('--ltd-banner-button-border-start', ['button_border_start', 'button_gradient_start'], globalButtonStyle.borderStart);
    setColor('--ltd-banner-button-border-end', ['button_border_end', 'button_gradient_end'], globalButtonStyle.borderEnd);
    setColor('--ltd-banner-button-hover-bg-start', ['button_hover_background_start', 'button_hover_bg_start'], globalButtonStyle.hoverBackgroundStart);
    setColor('--ltd-banner-button-hover-bg-end', ['button_hover_background_end', 'button_hover_bg_end'], globalButtonStyle.hoverBackgroundEnd);
    setColor('--ltd-banner-button-hover-text', ['button_hover_text_color', 'button_hover_color'], globalButtonStyle.hoverTextColor);
    setColor('--ltd-banner-button-hover-border-start', ['button_hover_border_start', 'button_hover_gradient_start'], globalButtonStyle.hoverBorderStart);
    setColor('--ltd-banner-button-hover-border-end', ['button_hover_border_end', 'button_hover_gradient_end'], globalButtonStyle.hoverBorderEnd);
    link.style.setProperty('--ltd-banner-button-border-width', readNumber(readItemValue(item, ['button_border_width']), globalButtonStyle.borderWidth, 0, 12) + 'px');
    link.style.setProperty('--ltd-banner-button-gradient-angle', readNumber(readItemValue(item, ['button_gradient_angle']), globalButtonStyle.gradientAngle, 0, 360) + 'deg');
    link.style.setProperty('--ltd-banner-button-hover-scale', String(readNumber(readItemValue(item, ['button_hover_scale']), globalButtonStyle.hoverScale, 1, 1.2)));
    link.style.setProperty('--ltd-banner-button-hover-lift', readNumber(readItemValue(item, ['button_hover_lift']), globalButtonStyle.hoverLift, -20, 0) + 'px');
    link.style.setProperty('--ltd-banner-button-flow-duration', readNumber(readItemValue(item, ['button_flow_duration']), globalButtonStyle.flowDuration, 1, 20) + 's');
  };

  const createContent = (item) =&gt; {
    const content = document.createElement('div');
    content.className = 'ltd-banner-content';
    if (item.title_color) content.style.setProperty('--ltd-banner-text-color', validColor(item.title_color, validColor(dataset.textColor, '#ffffff')));
    if (item.subtitle_color) content.style.setProperty('--ltd-banner-subtitle-color', validColor(item.subtitle_color, validColor(dataset.subtitleColor, '#ffffff')));
    if (item.title) {
      const title = document.createElement('h2');
      title.className = 'ltd-banner-title';
      title.textContent = item.title;
      content.appendChild(title);
    }
    if (item.subtitle) {
      const subtitle = document.createElement('p');
      subtitle.className = 'ltd-banner-subtitle';
      subtitle.textContent = item.subtitle;
      content.appendChild(subtitle);
    }
    if (item.buttonText &amp;&amp; item.jump) {
      const link = document.createElement('a');
      const mark = document.createElement('span');
      link.className = 'ltd-banner-cta';
      applyButtonStyle(link, item);
      link.href = item.jump.href;
      link.target = item.jump.target;
      if (item.jump.target === '_blank') link.rel = 'noopener noreferrer';
      link.appendChild(document.createTextNode(item.buttonText));
      mark.className = 'ltd-banner-cta-mark';
      mark.setAttribute('aria-hidden', 'true');
      link.appendChild(mark);
      content.appendChild(link);
    }
    return content;
  };

  activeItems.forEach((item, index) =&gt; {
    const slide = document.createElement('div');
    const overlay = document.createElement('div');
    slide.className = 'swiper-slide' + (index === 0 ? ' ltd-banner-active' : '');
    slide.setAttribute('data-slide-index', String(index));
    if (item.kind === 'video') {
      const video = document.createElement('video');
      video.className = 'ltd-banner-video';
      video.src = item.url;
      video.playsInline = true;
      video.muted = item.muted;
      video.controls = item.controls;
      video.autoplay = false;
      video.preload = item.autoplay ? 'auto' : 'metadata';
      if (item.poster) video.poster = item.poster;
      slide.appendChild(video);
    } else {
      const image = document.createElement('img');
      let imageUrlIndex = 0;
      image.className = 'ltd-banner-bg';
      image.alt = item.alt;
      image.loading = index === 0 ? 'eager' : 'lazy';
      image.decoding = 'async';
      image.addEventListener('error', () =&gt; {
        imageUrlIndex += 1;
        if (item.urls &amp;&amp; imageUrlIndex &lt; item.urls.length) {
          image.src = item.urls[imageUrlIndex];
          return;
        }
        slide.classList.add('is-media-error');
        if (image.parentNode) image.parentNode.removeChild(image);
        const errorText = document.createElement('div');
        errorText.className = 'ltd-banner-media-error';
        errorText.textContent = 'Banner 图片加载失败，请重新选择图片或检查图片地址。';
        slide.insertBefore(errorText, slide.firstChild);
      });
      image.src = item.urls[0];
      slide.appendChild(image);
    }
    overlay.className = 'ltd-banner-overlay';
    slide.appendChild(overlay);
    slide.appendChild(createContent(item));
    wrapper.appendChild(slide);
  });

  const pad2 = (value) =&gt; value &lt; 10 ? '0' + value : String(value);
  const setActive = (index) =&gt; {
    const slides = wrapper.querySelectorAll('.swiper-slide');
    for (let slideIndex = 0; slideIndex &lt; slides.length; slideIndex += 1) {
      slides[slideIndex].classList.toggle('ltd-banner-active', slideIndex === index);
    }
    currentNode.textContent = pad2(index + 1);
  };

  const pauseVideos = () =&gt; {
    const videos = root.querySelectorAll('video');
    for (let index = 0; index &lt; videos.length; index += 1) videos[index].pause();
  };

  const playActiveVideo = () =&gt; {
    pauseVideos();
    if (mediaType !== 'video' || reducedMotion || saveData || document.hidden) return;
    const activeSlide = root.querySelector('.swiper-slide-active') || root.querySelector('.ltd-banner-active');
    const video = activeSlide ? activeSlide.querySelector('video') : null;
    const realIndex = swiper &amp;&amp; Number.isFinite(swiper.realIndex) ? swiper.realIndex : 0;
    const item = activeItems[realIndex];
    if (!video || !item || !item.autoplay) return;
    const playPromise = video.play();
    if (playPromise &amp;&amp; typeof playPromise.catch === 'function') playPromise.catch(() =&gt; {});
  };

  const stopProgress = () =&gt; {
    if (progressFrame) window.cancelAnimationFrame(progressFrame);
    progressFrame = 0;
  };

  const startProgressFallback = () =&gt; {
    stopProgress();
    if (!autoplayEnabled || reducedMotion || activeItems.length &lt; 2) {
      progressFill.style.transform = 'scaleX(0)';
      return;
    }
    progressStartedAt = Date.now();
    const tick = () =&gt; {
      if (destroyed) return;
      const elapsed = Math.min(1, (Date.now() - progressStartedAt) / autoplayDelay);
      progressFill.style.transform = 'scaleX(' + elapsed + ')';
      if (elapsed &lt; 1) progressFrame = window.requestAnimationFrame(tick);
    };
    progressFrame = window.requestAnimationFrame(tick);
  };

  const handleSlideChange = () =&gt; {
    const index = swiper &amp;&amp; Number.isFinite(swiper.realIndex) ? swiper.realIndex : 0;
    setActive(index);
    playActiveVideo();
    startProgressFallback();
  };

  const bindVideoEndings = () =&gt; {
    const videos = root.querySelectorAll('video');
    for (let index = 0; index &lt; videos.length; index += 1) {
      const handler = () =&gt; {
        if (swiper &amp;&amp; autoplayEnabled &amp;&amp; activeItems.length &gt; 1 &amp;&amp; typeof swiper.slideNext === 'function') swiper.slideNext();
      };
      videos[index].addEventListener('ended', handler);
      videoEndedBindings.push({ video: videos[index], handler: handler });
    }
  };

  const enhanceWithSwiper = () =&gt; {
    if (destroyed || !root.isConnected || activeItems.length &lt; 2) return;
    try {
      swiper = new window.Swiper(root.querySelector('.ltd-banner-swiper'), {
        effect: 'fade',
        fadeEffect: { crossFade: true },
        loop: true,
        speed: 1200,
        autoplay: autoplayEnabled &amp;&amp; !reducedMotion ? { delay: autoplayDelay, disableOnInteraction: false } : false,
        on: {
          init: handleSlideChange,
          slideChange: handleSlideChange,
          autoplayTimeLeft: (instance, time, progressValue) =&gt; {
            if (autoplayEnabled &amp;&amp; Number.isFinite(progressValue)) progressFill.style.transform = 'scaleX(' + (1 - progressValue) + ')';
          }
        }
      });
      root._ltdBannerSwiper = swiper;
      bindVideoEndings();
    } catch (error) {
      swiper = null;
      setActive(0);
      playActiveVideo();
    }
  };

  const waitForSwiper = (attempt) =&gt; {
    if (destroyed || !root.isConnected || activeItems.length &lt; 2) return;
    if (typeof window.Swiper === 'function') {
      enhanceWithSwiper();
      return;
    }
    if (attempt &gt;= 20) {
      setActive(0);
      progress.hidden = true;
      playActiveVideo();
      return;
    }
    retryTimer = window.setTimeout(() =&gt; waitForSwiper(attempt + 1), 100);
  };

  const supportsAspectRatio = window.CSS &amp;&amp; typeof window.CSS.supports === 'function' &amp;&amp; window.CSS.supports('aspect-ratio', '16 / 9');
  const updateFallbackHeight = () =&gt; {
    if (supportsAspectRatio || !root.isConnected) return;
    const mobile = window.innerWidth &lt;= 768;
    const enabled = mobile ? mobileRatioMode : pcRatioMode;
    const ratio = mobile ? mobileRatio.value : pcRatio.value;
    root.style.height = enabled ? Math.round(root.clientWidth / ratio) + 'px' : '';
    root.style.minHeight = enabled ? '0' : '';
  };

  const handleResize = () =&gt; {
    if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
    resizeFrame = window.requestAnimationFrame(updateFallbackHeight);
  };

  const handleVisibility = () =&gt; {
    if (document.hidden) {
      pauseVideos();
      if (swiper &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.stop === 'function') swiper.autoplay.stop();
    } else {
      playActiveVideo();
      if (swiper &amp;&amp; autoplayEnabled &amp;&amp; !reducedMotion &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.start === 'function') swiper.autoplay.start();
    }
  };

  const handleFocusIn = () =&gt; {
    if (swiper &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.stop === 'function') swiper.autoplay.stop();
  };

  const handleFocusOut = () =&gt; {
    if (swiper &amp;&amp; autoplayEnabled &amp;&amp; !reducedMotion &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.start === 'function') swiper.autoplay.start();
  };

  root._ltdBannerCleanup = () =&gt; {

      kind: 'image',

      hasExplicitTitle: !!explicitTitle,
      subtitle: readText(item.subtitle) || readText(item.desc) || readText(item.description),
      buttonText: readText(item.button_text) || readText(item.cta_text) || (explicitTitle ? name : ''),
      jump: normalizeJump(item),
      button_background_start: readText(item.button_background_start),
      button_background_end: readText(item.button_background_end),
      button_text_color: readText(item.button_text_color),
      button_border_start: readText(item.button_border_start),
      button_border_end: readText(item.button_border_end),
      button_border_width: readText(item.button_border_width),

  const normalizeVideos = (value) =&gt; parseList(value, []).reduce((items, item) =&gt; {
    if (!item || typeof item !== 'object' || Array.isArray(item) || isHidden(item.hidden)) return items;
    const url = pickUrl(item, ['url', 'filepath', 'src']);

      subtitle: readText(item.subtitle) || readText(item.description) || readText(item.desc),
      buttonText: readText(item.button_text) || readText(item.cta_text) || (explicitTitle ? name : ''),
      autoplay: autoplay,
      controls: readSwitch(item.controls, false),
      muted: autoplay ? true : readSwitch(item.muted, true),
      jump: normalizeJump(item),
      button_background_start: readText(item.button_background_start),
      button_background_end: readText(item.button_background_end),
      button_text_color: readText(item.button_text_color),
      button_border_start: readText(item.button_border_start),

  }, []);

  const parseRatio = (value, fallback) =&gt; {
    const text = readText(value).replace(/[：／∶]/g, '/').replace(':', '/');
    const parts = text.split('/');
    let width;
    let height;
    if (parts.length === 2) {
      width = Number(parts[0]);
      height = Number(parts[1]);
    } else {
      width = Number(text);
      height = 1;
    }
    const ratio = width / height;
    if (!Number.isFinite(width) || !Number.isFinite(height) || width &lt;= 0 || height &lt;= 0 || ratio &lt; .25 || ratio &gt; 6) return fallback;

  };

  const validColor = (value, fallback) =&gt; {
    const color = readText(value);
    if (!color || !window.CSS || typeof window.CSS.supports !== 'function') return /^#(?:[\da-f]{3}|[\da-f]{6}|[\da-f]{8})$/i.test(color) ? color : fallback;

  };

  const readItemValue = (item, keys) =&gt; {
    for (let index = 0; index &lt; keys.length; index += 1) {

      if (value) return value;
    }
    return '';
  };

  const dataset = root.dataset;
  const mediaType = readEnum(dataset.mediaType, ['image', 'video'], 'image');
  const autoplayEnabled = readSwitch(dataset.autoplay, true);

  const titleSize = readNumber(dataset.titleFontSize, 120, 16, 120);

  const titleWeight = readNumber(dataset.titleFontWeight, 600, 100, 900);
  const overlayOpacity = readNumber(dataset.overlayOpacity, .28, 0, 1);
  const contentBottom = readNumber(dataset.contentBottom, 105, 0, 1000);
  const contentLeft = readNumber(dataset.contentLeft, 0, 0, 1000);
  const mobileRatioMode = readSwitch(dataset.mobileRatioMode, false);
  const pcRatioMode = readSwitch(dataset.pcRatioMode, false);
  const showOverlay = readSwitch(dataset.showOverlay, true);
  const inheritFirstContent = readSwitch(dataset.inheritFirstContent, true);
  const pcRatio = parseRatio(dataset.pcAspectRatio, { css: '16 / 9', value: 16 / 9 });

  const reducedMotion = window.matchMedia &amp;&amp; window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const saveData = navigator.connection &amp;&amp; navigator.connection.saveData === true;
  const activeItems = mediaType === 'video' ? normalizeVideos(rawVideoSlides) : normalizeImages(rawSlides);

  root.dataset.mediaType = mediaType;
  root.dataset.autoplay = autoplayEnabled ? '1' : '0';
  root.dataset.mobileRatioMode = mobileRatioMode ? '1' : '0';
  root.dataset.pcRatioMode = pcRatioMode ? '1' : '0';

  root.style.setProperty('--ltd-banner-pc-aspect-ratio', pcRatio.css);
  root.style.setProperty('--ltd-banner-mobile-aspect-ratio', mobileRatio.css);

  const globalButtonStyle = {
    backgroundStart: validColor(dataset.buttonBackgroundStart, '#ffffff'),

    borderStart: validColor(dataset.buttonBorderStart, '#ffffff'),
    borderEnd: validColor(dataset.buttonBorderEnd, '#ffffff'),

  for (let variableIndex = 0; variableIndex &lt; activeItems.length &amp;&amp; variableIndex &lt; slideVariableContent.length; variableIndex += 1) {

    if (variableContent.subtitle) variableItem.subtitle = variableContent.subtitle;

    if (variableContent.buttonHoverBorderStart) variableItem.button_hover_border_start = variableContent.buttonHoverBorderStart;
    if (variableContent.buttonHoverBorderEnd) variableItem.button_hover_border_end = variableContent.buttonHoverBorderEnd;
  }

  const applyButtonStyle = (link, item) =&gt; {
    const setColor = (property, keys, fallback) =&gt; link.style.setProperty(property, validColor(readItemValue(item, keys), fallback));
    setColor('--ltd-banner-button-bg-start', ['button_background_start', 'button_bg_start'], globalButtonStyle.backgroundStart);
    setColor('--ltd-banner-button-bg-end', ['button_background_end', 'button_bg_end'], globalButtonStyle.backgroundEnd);
    setColor('--ltd-banner-button-text', ['button_text_color', 'button_color'], globalButtonStyle.textColor);
    setColor('--ltd-banner-button-border-start', ['button_border_start', 'button_gradient_start'], globalButtonStyle.borderStart);
    setColor('--ltd-banner-button-border-end', ['button_border_end', 'button_gradient_end'], globalButtonStyle.borderEnd);
    setColor('--ltd-banner-button-hover-bg-start', ['button_hover_background_start', 'button_hover_bg_start'], globalButtonStyle.hoverBackgroundStart);
    setColor('--ltd-banner-button-hover-bg-end', ['button_hover_background_end', 'button_hover_bg_end'], globalButtonStyle.hoverBackgroundEnd);
    setColor('--ltd-banner-button-hover-text', ['button_hover_text_color', 'button_hover_color'], globalButtonStyle.hoverTextColor);
    setColor('--ltd-banner-button-hover-border-start', ['button_hover_border_start', 'button_hover_gradient_start'], globalButtonStyle.hoverBorderStart);
    setColor('--ltd-banner-button-hover-border-end', ['button_hover_border_end', 'button_hover_gradient_end'], globalButtonStyle.hoverBorderEnd);
    link.style.setProperty('--ltd-banner-button-border-width', readNumber(readItemValue(item, ['button_border_width']), globalButtonStyle.borderWidth, 0, 12) + 'px');
    link.style.setProperty('--ltd-banner-button-gradient-angle', readNumber(readItemValue(item, ['button_gradient_angle']), globalButtonStyle.gradientAngle, 0, 360) + 'deg');
    link.style.setProperty('--ltd-banner-button-hover-scale', String(readNumber(readItemValue(item, ['button_hover_scale']), globalButtonStyle.hoverScale, 1, 1.2)));
    link.style.setProperty('--ltd-banner-button-hover-lift', readNumber(readItemValue(item, ['button_hover_lift']), globalButtonStyle.hoverLift, -20, 0) + 'px');
    link.style.setProperty('--ltd-banner-button-flow-duration', readNumber(readItemValue(item, ['button_flow_duration']), globalButtonStyle.flowDuration, 1, 20) + 's');
  };

  const createContent = (item) =&gt; {
    const content = document.createElement('div');
    content.className = 'ltd-banner-content';
    if (item.title_color) content.style.setProperty('--ltd-banner-text-color', validColor(item.title_color, validColor(dataset.textColor, '#ffffff')));
    if (item.subtitle_color) content.style.setProperty('--ltd-banner-subtitle-color', validColor(item.subtitle_color, validColor(dataset.subtitleColor, '#ffffff')));

  };

  activeItems.forEach((item, index) =&gt; {
    const slide = document.createElement('div');
    const overlay = document.createElement('div');
    slide.className = 'swiper-slide' + (index === 0 ? ' ltd-banner-active' : '');

    } else {

      image.alt = item.alt;
      image.loading = index === 0 ? 'eager' : 'lazy';
      image.decoding = 'async';

    slide.appendChild(overlay);
    slide.appendChild(createContent(item));
    wrapper.appendChild(slide);
  });

  const pad2 = (value) =&gt; value &lt; 10 ? '0' + value : String(value);
  const setActive = (index) =&gt; {
    const slides = wrapper.querySelectorAll('.swiper-slide');
    for (let slideIndex = 0; slideIndex &lt; slides.length; slideIndex += 1) {

    }
    currentNode.textContent = pad2(index + 1);
  };

  const pauseVideos = () =&gt; {
    const videos = root.querySelectorAll('video');
    for (let index = 0; index &lt; videos.length; index += 1) videos[index].pause();
  };

  const playActiveVideo = () =&gt; {
    pauseVideos();
    if (mediaType !== 'video' || reducedMotion || saveData || document.hidden) return;
    const activeSlide = root.querySelector('.swiper-slide-active') || root.querySelector('.ltd-banner-active');
    const video = activeSlide ? activeSlide.querySelector('video') : null;

  const stopProgress = () =&gt; {

    progressFrame = 0;
  };

  const startProgressFallback = () =&gt; {
    stopProgress();
    if (!autoplayEnabled || reducedMotion || activeItems.length &lt; 2) {

    const tick = () =&gt; {

  };

  const bindVideoEndings = () =&gt; {

    for (let index = 0; index &lt; videos.length; index += 1) {

        if (swiper &amp;&amp; autoplayEnabled &amp;&amp; activeItems.length &gt; 1 &amp;&amp; typeof swiper.slideNext === 'function') swiper.slideNext();

      setActive(0);
      playActiveVideo();
    }

  const waitForSwiper = (attempt) =&gt; {

      return;
    }
    if (attempt &gt;= 20) {

      progress.hidden = true;

  const supportsAspectRatio = window.CSS &amp;&amp; typeof window.CSS.supports === 'function' &amp;&amp; window.CSS.supports('aspect-ratio', '16 / 9');

    if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
    resizeFrame = window.requestAnimationFrame(updateFallbackHeight);
  };

      playActiveVideo();

  };

  const handleFocusIn = () =&gt; {
    if (swiper &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.stop === 'function') swiper.autoplay.stop();
  };

  const handleFocusOut = () =&gt; {
    if (swiper &amp;&amp; autoplayEnabled &amp;&amp; !reducedMotion &amp;&amp; swiper.autoplay &amp;&amp; typeof swiper.autoplay.start === 'function') swiper.autoplay.start();
  };

  root._ltdBannerCleanup = () =&gt; {
    destroyed = true;
    if (retryTimer) window.clearTimeout(retryTimer);
    if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
    stopProgress();
    pauseVideos();

    }
