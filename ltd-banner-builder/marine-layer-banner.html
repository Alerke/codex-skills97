<!-- @dsCard group="LTD Banner" name="Coastal Editorial Banner" subtitle="Marine Layer 风格 / 图片视频 / 居中文案 / 比例模式 / Swiper 降级" -->
<style data-banner-initial>

.ltdBanner20260821 *{box-sizing:border-box;}
.ltdBanner20260821 .ltd-banner-swiper,.ltdBanner20260821 .swiper-wrapper,.ltdBanner20260821 .swiper-slide{height:100%;width:100%;}

@media (max-width:768px){.ltdBanner20260821[data-mobile-ratio-mode="1"]{aspect-ratio:var(--ltd-banner-mobile-aspect-ratio,4 / 5);height:auto;min-height:0;}}
</style>

<style data-banner-styles>
.ltdBanner20260821 .ltd-banner-swiper{overflow:hidden;position:relative;z-index:1;}
.ltdBanner20260821 .ltd-banner-media{height:100%;inset:0;position:absolute;width:100%;}
.ltdBanner20260821 .ltd-banner-bg,.ltdBanner20260821 .ltd-banner-video{display:block;height:100%;object-fit:cover;transform:scale(1.025);transition:transform 7s cubic-bezier(.2,.7,.2,1);width:100%;}
.ltdBanner20260821 .swiper-slide-active .ltd-banner-bg,.ltdBanner20260821 .swiper-slide-active .ltd-banner-video,.ltdBanner20260821 .swiper-slide:first-child .ltd-banner-bg{transform:scale(1);}
.ltdBanner20260821 .ltd-banner-media-fallback{align-items:center;background:linear-gradient(135deg,#9fb8be,#d8aa91);color:#fff;display:none;height:100%;justify-content:center;padding:28px;text-align:center;width:100%;}
.ltdBanner20260821 .has-media-error .ltd-banner-media-fallback{display:flex;}
.ltdBanner20260821 .has-media-error .ltd-banner-bg,.ltdBanner20260821 .has-media-error .ltd-banner-video{display:none;}
.ltdBanner20260821 .ltd-banner-overlay{background:linear-gradient(180deg,rgba(15,28,31,.08) 0%,rgba(15,28,31,.05) 36%,rgba(25,22,21,var(--ltd-banner-overlay-opacity,.28)) 100%);inset:0;pointer-events:none;position:absolute;z-index:1;}
.ltdBanner20260821[data-show-overlay="0"] .ltd-banner-overlay{display:none;}
.ltdBanner20260821 .ltd-banner-content{align-items:center;bottom:var(--ltd-banner-content-bottom,86px);display:flex;flex-direction:column;left:50%;max-width:min(760px,calc(100% - 48px));position:absolute;text-align:center;transform:translateX(calc(-50% + var(--ltd-banner-content-left,0px)));width:100%;z-index:2;}
.ltdBanner20260821 .ltd-banner-title{color:var(--ltd-banner-text-color,#fff);font-family:"Source Han Serif SC","思源宋体 CN","思源宋体","Noto Serif CJK SC",STSong,SimSun,serif;font-size:clamp(42px,var(--ltd-banner-title-size,64px),84px);font-weight:var(--ltd-banner-title-weight,500);letter-spacing:.055em;line-height:1.08;margin:0;max-width:760px;opacity:0;text-wrap:balance;transform:translateY(24px);transition:opacity .75s ease .1s,transform .75s ease .1s;}
.ltdBanner20260821 .ltd-banner-subtitle{color:var(--ltd-banner-subtitle-color,#fff);font-family:"Source Han Sans SC","思源黑体 CN","思源黑体","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:var(--ltd-banner-subtitle-size,17px);font-weight:400;letter-spacing:.06em;line-height:1.8;margin:22px 0 0;max-width:680px;opacity:0;transform:translateY(18px);transition:opacity .7s ease .23s,transform .7s ease .23s;}
.ltdBanner20260821 .ltd-banner-cta{align-items:center;background:var(--ltd-banner-button-bg,#fff);border:1px solid var(--ltd-banner-button-bg,#fff);color:var(--ltd-banner-button-color,#33434a);display:inline-flex;font-family:"Source Han Sans SC","思源黑体 CN","思源黑体","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;justify-content:center;letter-spacing:.12em;margin-top:26px;min-height:48px;min-width:164px;padding:13px 24px;text-decoration:none;transition:background-color .25s ease,border-color .25s ease,color .25s ease,transform .25s ease;}
.ltdBanner20260821 .ltd-banner-cta:hover,.ltdBanner20260821 .ltd-banner-cta:focus-visible{background:var(--ltd-banner-button-hover-bg,#33434a);border-color:var(--ltd-banner-button-hover-bg,#33434a);color:var(--ltd-banner-button-hover-color,#fff);transform:translateY(-2px);}
.ltdBanner20260821 .swiper-slide-active .ltd-banner-title,.ltdBanner20260821 .swiper-slide-active .ltd-banner-subtitle,.ltdBanner20260821 .swiper-slide:first-child .ltd-banner-title,.ltdBanner20260821 .swiper-slide:first-child .ltd-banner-subtitle{opacity:1;transform:translateY(0);}
.ltdBanner20260821 .ltd-banner-indicators{align-items:center;bottom:24px;display:flex;gap:6px;left:50%;position:absolute;transform:translateX(-50%);z-index:3;}
.ltdBanner20260821 .ltd-banner-indicator{appearance:none;background:transparent;border:0;cursor:pointer;height:24px;margin:0;padding:11px 3px;width:52px;}
.ltdBanner20260821 .ltd-banner-indicator-track{background:var(--ltd-banner-indicator-color,rgba(255,255,255,.42));display:block;height:2px;overflow:hidden;width:100%;}
.ltdBanner20260821 .ltd-banner-indicator-fill{background:var(--ltd-banner-indicator-active-color,#fff);display:block;height:100%;transform:scaleX(0);transform-origin:left center;width:100%;}
.ltdBanner20260821 .ltd-banner-indicator.is-active .ltd-banner-indicator-track{height:3px;}
.ltdBanner20260821 .ltd-banner-indicator:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.ltdBanner20260821.is-static .ltd-banner-indicators,.ltdBanner20260821.is-empty .ltd-banner-indicators{display:none;}
@media (max-width:768px){
  .ltdBanner20260821 .ltd-banner-content{bottom:min(var(--ltd-banner-content-bottom,72px),92px);max-width:calc(100% - 32px);transform:translateX(-50%);}
  .ltdBanner20260821 .ltd-banner-title{font-size:clamp(38px,var(--ltd-banner-title-size,58px),68px);line-height:.96;}
  .ltdBanner20260821 .ltd-banner-subtitle{font-size:min(var(--ltd-banner-subtitle-size,16px),17px);margin-top:18px;}
  .ltdBanner20260821 .ltd-banner-cta{margin-top:22px;min-height:46px;min-width:164px;}
  .ltdBanner20260821 .ltd-banner-indicators{bottom:14px;}
  .ltdBanner20260821 .ltd-banner-indicator{width:40px;}
}
@media (prefers-reduced-motion:reduce){
  .ltdBanner20260821 .ltd-banner-bg,.ltdBanner20260821 .ltd-banner-video,.ltdBanner20260821 .ltd-banner-title,.ltdBanner20260821 .ltd-banner-subtitle,.ltdBanner20260821 .ltd-banner-cta{transition:none;}
}
</style>

<div class="ltdBanner20260821"
  role="region"
  aria-label="品牌视觉 Banner"
  data-media-type="$[media_type]"
  data-slide1-title="$[slide_1_title]"
  data-slide1-subtitle="$[slide_1_subtitle]"
  data-slide2-title="$[slide_2_title]"
  data-slide2-subtitle="$[slide_2_subtitle]"
  data-slide3-title="$[slide_3_title]"
  data-slide3-subtitle="$[slide_3_subtitle]"
  data-autoplay="$[autoplay]"
  data-autoplay-delay="$[autoplay_delay]"
  data-title-font-size="$[title_font_size]"
  data-subtitle-font-size="$[subtitle_font_size]"
  data-title-font-weight="$[title_font_weight]"
  data-text-color="$[text_color]"
  data-subtitle-color="$[subtitle_color]"
  data-overlay-opacity="$[overlay_opacity]"
  data-content-bottom="$[content_bottom]"
  data-content-left="$[content_left]"
  data-mobile-ratio-mode="$[mobile_ratio_mode]"
  data-mobile-aspect-ratio="$[mobile_aspect_ratio]"
  data-pc-ratio-mode="$[pc_ratio_mode]"
  data-pc-aspect-ratio="$[pc_aspect_ratio]"
  data-show-overlay="$[show_overlay]"
  data-button-text="$[button_text]"
  data-button-link-type="$[button_link.type]"
  data-button-link-href="$[button_link.href]"
  data-button-link-target="$[button_link.target]"
  data-button-background-color="$[button_background_color]"
  data-button-text-color="$[button_text_color]"
  data-button-hover-background-color="$[button_hover_background_color]"
  data-button-hover-text-color="$[button_hover_text_color]"
  data-indicator-color="$[indicator_color]"
  data-indicator-active-color="$[indicator_active_color]">
  <div class="ltd-banner-swiper swiper-container">
    <div class="swiper-wrapper"></div>
  </div>
  <div class="ltd-banner-empty" role="status">请在“轮播内容列表”中添加图片或切换到视频模式。</div>
  <div class="ltd-banner-indicators" role="tablist" aria-label="轮播切换"></div>
</div>

<script>
(() => {
  const script = document.currentScript;
  const previous = script ? script.previousElementSibling : null;
  const moduleHost = script && script.closest ? script.closest('.gw-browse-module') : null;
  const root = previous && previous.classList && previous.classList.contains('ltdBanner20260821')
    ? previous
    : (moduleHost ? moduleHost.querySelector('.ltdBanner20260821') : null);
  if (!root) return;

  if (typeof root.__ltdBannerCleanup === 'function') root.__ltdBannerCleanup();

  const rawSlides = (() => {
    try { return $[slides]; } catch (error) { return []; }
  })();
  const rawVideoSlides = (() => {
    try { return $[video_slides]; } catch (error) { return []; }
  })();

  const wrapper = root.querySelector('.swiper-wrapper');
  const swiperElement = root.querySelector('.ltd-banner-swiper');
  const indicatorsElement = root.querySelector('.ltd-banner-indicators');
  const dataset = root.dataset;
  const rawButtonLink = {
    type: dataset.buttonLinkType,
    href: dataset.buttonLinkHref,
    target: dataset.buttonLinkTarget
  };
  let swiper = null;
  let retryTimer = 0;
  let resizeFrame = 0;
  let progressFrame = 0;
  let progressStartedAt = 0;
  let progressPaused = false;
  let activeProgressFill = null;
  let activeItemIndex = 0;
  let destroyed = false;

  const readSwitch = (value, fallback) => {
    if (value === true || value === 1 || value === '1' || value === 'true') return true;
    if (value === false || value === 0 || value === '0' || value === 'false') return false;
    return fallback;
  };
  const readNumber = (value, fallback, min, max) => {
    const number = Number(value);
    if (!Number.isFinite(number)) return fallback;
    return Math.min(max, Math.max(min, number));
  };
  const readEnum = (value, allowed, fallback) => {
    const text = String(value == null ? '' : value).trim();
    return allowed.indexOf(text) >= 0 ? text : fallback;
  };
  const readText = (value) => {
    if (typeof value === 'string' || typeof value === 'number') {
      const text = String(value).trim();
      return /^\$\[[^\]]+\]$/.test(text) ? '' : text;
    }
    return '';
  };
  const readHidden = (value) => (
    value === true || value === 1 || value === '1' || value === 'true'
  );
  const parseList = (value) => {
    if (Array.isArray(value)) return value;
    if (typeof value !== 'string' || !value.trim()) return [];
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      return [];
    }
  };
  const mediaValue = (value) => {
    if (typeof value === 'string') return value.trim();
    if (!value || typeof value !== 'object') return '';
    const keys = ['url', 'src', 'filepath', 'path'];
    for (let index = 0; index < keys.length; index += 1) {
      const candidate = value[keys[index]];
      if (typeof candidate === 'string' && candidate.trim()) return candidate.trim();
    }
    return '';
  };
  const isSafeMediaUrl = (value) => {
    const url = readText(value);
    if (!url || /^(?:javascript|data|vbscript):/i.test(url)) return false;
    return /^(?:https?:)?\/\//i.test(url) || /^\.{0,2}\//.test(url) || /^[\w-][\w./%-]*$/.test(url);
  };
  const normalizeJump = (item) => {
    const source = item && item.jump && typeof item.jump === 'object' ? item.jump : item || {};
    const type = readEnum(source.type, ['none', 'web', 'url', 'mobile', 'email'], 'none');
    let href = readText(source.href || source.url);
    const target = source.target === '_blank' ? '_blank' : '_self';
    if (type === 'none' || !href || /^(?:javascript|data|vbscript):/i.test(href)) return null;
    if (type === 'mobile' && !/^tel:/i.test(href)) href = 'tel:' + href.replace(/[^+\d]/g, '');
    if (type === 'email' && !/^mailto:/i.test(href)) href = 'mailto:' + href;
    if ((type === 'web' || type === 'url') && !(/^(?:https?:)?\/\//i.test(href) || /^\.{0,2}\//.test(href) || /^#[\w-]+$/.test(href) || /^[\w-][\w./?%#=&-]*$/.test(href))) return null;
    return { href, target };
  };
  const validColor = (value, fallback) => {
    const color = readText(value);
    if (!color) return fallback;
    if (window.CSS && typeof window.CSS.supports === 'function' && window.CSS.supports('color', color)) return color;
    return /^(?:#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\)|hsla?\([\d\s.,%deg]+\))$/i.test(color) ? color : fallback;
  };
  const parseRatio = (value, fallbackWidth, fallbackHeight) => {
    const text = readText(value).replace(/[：／∶]/g, '/').replace(':', '/');
    let width = fallbackWidth;
    let height = fallbackHeight;
    if (text.indexOf('/') >= 0) {
      const parts = text.split('/');
      const nextWidth = Number(parts[0]);
      const nextHeight = Number(parts[1]);
      if (Number.isFinite(nextWidth) && Number.isFinite(nextHeight) && nextWidth > 0 && nextHeight > 0) {
        width = nextWidth;
        height = nextHeight;
      }
    } else {
      const decimal = Number(text);
      if (Number.isFinite(decimal) && decimal > 0) {
        width = decimal;
        height = 1;
      }
    }
    const ratio = Math.min(5, Math.max(.35, width / height));
    return { css: ratio + ' / 1', value: ratio };
  };

  const mediaType = readEnum(dataset.mediaType, ['image', 'video'], 'image');
  const autoplay = readSwitch(dataset.autoplay, true);
  const autoplayDelay = readNumber(dataset.autoplayDelay, 6000, 1500, 20000);
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pcRatio = parseRatio(dataset.pcAspectRatio, 21, 9);
  const mobileRatio = parseRatio(dataset.mobileAspectRatio, 4, 5);

  root.setAttribute('data-pc-ratio-mode', readSwitch(dataset.pcRatioMode, true) ? '1' : '0');
  root.setAttribute('data-mobile-ratio-mode', readSwitch(dataset.mobileRatioMode, false) ? '1' : '0');
  root.setAttribute('data-show-overlay', readSwitch(dataset.showOverlay, true) ? '1' : '0');
  root.style.setProperty('--ltd-banner-title-size', readNumber(dataset.titleFontSize, 68, 16, 120) + 'px');
  root.style.setProperty('--ltd-banner-subtitle-size', readNumber(dataset.subtitleFontSize, 17, 10, 60) + 'px');
  root.style.setProperty('--ltd-banner-title-weight', String(readNumber(dataset.titleFontWeight, 400, 100, 900)));
  root.style.setProperty('--ltd-banner-text-color', validColor(dataset.textColor, '#ffffff'));
  root.style.setProperty('--ltd-banner-subtitle-color', validColor(dataset.subtitleColor, '#ffffff'));
  root.style.setProperty('--ltd-banner-overlay-opacity', String(readNumber(dataset.overlayOpacity, .28, 0, 1)));
  root.style.setProperty('--ltd-banner-content-bottom', readNumber(dataset.contentBottom, 86, 0, 1000) + 'px');
  root.style.setProperty('--ltd-banner-content-left', readNumber(dataset.contentLeft, 0, -1000, 1000) + 'px');
  root.style.setProperty('--ltd-banner-pc-aspect-ratio', pcRatio.css);
  root.style.setProperty('--ltd-banner-mobile-aspect-ratio', mobileRatio.css);
  root.style.setProperty('--ltd-banner-button-bg', validColor(dataset.buttonBackgroundColor, '#ffffff'));
  root.style.setProperty('--ltd-banner-button-color', validColor(dataset.buttonTextColor, '#33434a'));
  root.style.setProperty('--ltd-banner-button-hover-bg', validColor(dataset.buttonHoverBackgroundColor, '#33434a'));
  root.style.setProperty('--ltd-banner-button-hover-color', validColor(dataset.buttonHoverTextColor, '#ffffff'));
  root.style.setProperty('--ltd-banner-indicator-color', validColor(dataset.indicatorColor, 'rgba(255,255,255,.42)'));
  root.style.setProperty('--ltd-banner-indicator-active-color', validColor(dataset.indicatorActiveColor, '#ffffff'));

  const buttonText = readText(dataset.buttonText) || '探索新季';
  const globalButtonJump = normalizeJump(rawButtonLink);
  const configuredCopy = (itemIndex, fallbackTitle, fallbackSubtitle) => {
    if (itemIndex > 2) return { title: fallbackTitle, subtitle: fallbackSubtitle };
    const prefix = 'slide' + (itemIndex + 1);
    return {
      title: readText(dataset[prefix + 'Title']),
      subtitle: readText(dataset[prefix + 'Subtitle'])
    };
  };

  const normalizeImages = (list) => parseList(list).filter((item) => item && typeof item === 'object' && !readHidden(item.hidden)).map((item, itemIndex) => {
    const keys = ['url', 'image', 'filepath', 'src', 'filepath_thumb'];
    let imageUrl = '';
    for (let index = 0; index < keys.length; index += 1) {
      const candidate = mediaValue(item[keys[index]]);
      if (isSafeMediaUrl(candidate)) { imageUrl = candidate; break; }
    }
    if (!imageUrl) return null;
    const copy = configuredCopy(
      itemIndex,
      readText(item.title || item.name),
      readText(item.subtitle || item.desc || item.description)
    );
    return {
      kind: 'image',
      url: imageUrl,
      alt: readText(item.name || item.title),
      title: copy.title,
      subtitle: copy.subtitle,
      jump: normalizeJump(item)
    };
  }).filter((item) => item);

  const normalizeVideos = (list) => parseList(list).filter((item) => item && typeof item === 'object' && !readHidden(item.hidden)).map((item, itemIndex) => {
    const url = mediaValue(item.url || item.src || item.filepath);
    if (!isSafeMediaUrl(url)) return null;
    const poster = mediaValue(item.poster || item.cover || item.image);
    const itemAutoplay = readSwitch(item.autoplay, false);
    const copy = configuredCopy(
      itemIndex,
      readText(item.title || item.name),
      readText(item.subtitle || item.description || item.desc)
    );
    return {
      kind: 'video',
      url,
      poster: isSafeMediaUrl(poster) ? poster : '',
      title: copy.title,
      subtitle: copy.subtitle,
      autoplay: itemAutoplay,
      muted: itemAutoplay ? true : readSwitch(item.muted, true),
      controls: readSwitch(item.controls, false),
      jump: normalizeJump(item)
    };
  }).filter((item) => item);

  const items = mediaType === 'video' ? normalizeVideos(rawVideoSlides) : normalizeImages(rawSlides);
  while (wrapper.firstChild) wrapper.removeChild(wrapper.firstChild);
  while (indicatorsElement.firstChild) indicatorsElement.removeChild(indicatorsElement.firstChild);

  const createContent = (item) => {
    const content = document.createElement('div');
    content.className = 'ltd-banner-content';
    if (item.title) {
      const title = document.createElement('h2');
      title.className = 'ltd-banner-title';
      title.textContent = item.title;
      content.appendChild(title);
    }
    if (item.subtitle) {
      const subtitle = document.createElement('p');
      subtitle.className = 'ltd-banner-subtitle';
      subtitle.textContent = item.subtitle;
      content.appendChild(subtitle);
    }
    const buttonJump = item.jump || globalButtonJump;
    if (buttonText && buttonJump) {
      const cta = document.createElement('a');
      cta.className = 'ltd-banner-cta';
      cta.href = buttonJump.href;
      cta.target = buttonJump.target;
      if (buttonJump.target === '_blank') cta.rel = 'noopener noreferrer';
      cta.textContent = buttonText;
      content.appendChild(cta);
    }
    return content;
  };

  items.forEach((item, itemIndex) => {
    const slide = document.createElement('div');
    const media = document.createElement('div');
    const fallback = document.createElement('div');
    const overlay = document.createElement('div');
    slide.className = 'swiper-slide';
    slide.setAttribute('data-item-index', String(itemIndex));
    media.className = 'ltd-banner-media';
    fallback.className = 'ltd-banner-media-fallback';
    fallback.textContent = item.title || 'Media unavailable';
    overlay.className = 'ltd-banner-overlay';
    if (item.kind === 'video') {
      const video = document.createElement('video');
      video.className = 'ltd-banner-video';
      video.src = item.url;
      video.playsInline = true;
      video.muted = item.muted;
      video.controls = item.controls;
      video.autoplay = false;
      video.preload = item.autoplay ? 'auto' : 'metadata';
      if (item.poster) video.poster = item.poster;
      video.addEventListener('error', () => slide.classList.add('has-media-error'));
      media.appendChild(video);
    } else {
      const image = document.createElement('img');
      image.className = 'ltd-banner-bg';
      image.src = item.url;
      image.alt = item.alt;
      image.loading = itemIndex === 0 ? 'eager' : 'lazy';
      image.decoding = 'async';
      image.addEventListener('error', () => slide.classList.add('has-media-error'));
      media.appendChild(image);
    }
    media.appendChild(fallback);
    slide.appendChild(media);
    slide.appendChild(overlay);
    slide.appendChild(createContent(item));
    wrapper.appendChild(slide);
  });

  const updateIndicators = (index) => {
    activeItemIndex = index;
    const buttons = indicatorsElement.querySelectorAll('.ltd-banner-indicator');
    Array.prototype.forEach.call(buttons, (button, buttonIndex) => {
      const active = buttonIndex === index;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-selected', active ? 'true' : 'false');
      const fill = button.querySelector('.ltd-banner-indicator-fill');
      if (fill) fill.style.transform = 'scaleX(0)';
      if (active) activeProgressFill = fill;
    });
  };
  const pauseAllVideos = () => {
    Array.prototype.forEach.call(root.querySelectorAll('video'), (video) => {
      try { video.pause(); } catch (error) { /* media state can change */ }
    });
  };
  const playActiveVideo = () => {
    pauseAllVideos();
    const active = root.querySelector('.swiper-slide-active') || wrapper.firstElementChild;
    if (!active) return;
    const index = Number(active.getAttribute('data-item-index')) || 0;
    const item = items[index];
    const video = active.querySelector('video');
    if (!item || !video || !item.autoplay || reducedMotion || document.hidden || (navigator.connection && navigator.connection.saveData)) return;
    video.muted = true;
    const result = video.play();
    if (result && typeof result.catch === 'function') result.catch(() => {});
  };
  const stopProgress = () => {
    if (progressFrame) window.cancelAnimationFrame(progressFrame);
    progressFrame = 0;
  };
  const animateProgress = () => {
    if (destroyed || !autoplay || reducedMotion || items.length < 2) return;
    const tick = (time) => {
      if (destroyed) return;
      if (!progressPaused) {
        if (!progressStartedAt) progressStartedAt = time;
        const progress = Math.min(1, (time - progressStartedAt) / autoplayDelay);
        if (activeProgressFill) activeProgressFill.style.transform = 'scaleX(' + progress + ')';
      }
      progressFrame = window.requestAnimationFrame(tick);
    };
    stopProgress();
    progressStartedAt = 0;
    progressFrame = window.requestAnimationFrame(tick);
  };
  const restartProgress = () => {
    if (activeProgressFill) activeProgressFill.style.transform = 'scaleX(0)';
    animateProgress();
  };

  items.forEach((item, index) => {
    const button = document.createElement('button');
    const track = document.createElement('span');
    const fill = document.createElement('span');
    button.type = 'button';
    button.className = 'ltd-banner-indicator';
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-label', '切换到第' + (index + 1) + '张');
    track.className = 'ltd-banner-indicator-track';
    fill.className = 'ltd-banner-indicator-fill';
    track.appendChild(fill);
    button.appendChild(track);
    button.addEventListener('click', () => {
      if (!swiper) return;
      if (typeof swiper.slideToLoop === 'function') swiper.slideToLoop(index);
      else if (typeof swiper.slideTo === 'function') swiper.slideTo(index);
    });
    indicatorsElement.appendChild(button);
  });

  root.classList.toggle('is-empty', items.length === 0);
  root.classList.toggle('is-static', items.length < 2);
  updateIndicators(0);

  const initSwiper = () => {
    if (destroyed || items.length < 2 || typeof window.Swiper !== 'function') return;
    try {
      swiper = new window.Swiper(swiperElement, {
        effect: 'fade',
        fadeEffect: { crossFade: true },
        loop: true,
        speed: 950,
        allowTouchMove: true,
        autoplay: autoplay && !reducedMotion ? { delay: autoplayDelay, disableOnInteraction: false } : false,
        on: {
          init: () => { updateIndicators(0); playActiveVideo(); restartProgress(); },
          slideChange: function () {
            const index = typeof this.realIndex === 'number' ? this.realIndex : 0;
            updateIndicators(index);
            playActiveVideo();
            restartProgress();
          },
          autoplayTimeLeft: (instance, time, progress) => {
            stopProgress();
            if (activeProgressFill) activeProgressFill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, 1 - progress)) + ')';
          }
        }
      });
      root.__ltdBannerSwiper = swiper;
    } catch (error) {
      swiper = null;
      root.classList.add('is-static');
    }
  };
  const waitForSwiper = (attempt) => {
    if (destroyed || !root.isConnected || items.length < 2) return;
    if (typeof window.Swiper === 'function') { initSwiper(); return; }
    if (attempt >= 20) { root.classList.add('is-static'); return; }
    retryTimer = window.setTimeout(() => waitForSwiper(attempt + 1), 100);
  };

  if (items.length === 1) {
    const video = wrapper.querySelector('video');
    if (video && items[0].autoplay && !reducedMotion) {
      video.loop = true;
      playActiveVideo();
    }
  } else if (items.length > 1) {
    waitForSwiper(0);
  }

  const supportsAspectRatio = window.CSS && typeof window.CSS.supports === 'function' && window.CSS.supports('aspect-ratio', '16 / 9');
  const updateFallbackHeight = () => {
    if (supportsAspectRatio || destroyed || !root.isConnected) return;
    const mobile = window.innerWidth <= 768;
    const ratioMode = mobile ? readSwitch(dataset.mobileRatioMode, false) : readSwitch(dataset.pcRatioMode, true);
    if (!ratioMode) { root.style.height = ''; return; }
    root.style.height = Math.round(root.clientWidth / (mobile ? mobileRatio.value : pcRatio.value)) + 'px';
  };
  const onResize = () => {
    if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
    resizeFrame = window.requestAnimationFrame(updateFallbackHeight);
  };
  const onVisibility = () => {
    progressPaused = document.hidden;
    if (document.hidden) {
      pauseAllVideos();
      if (swiper && swiper.autoplay && typeof swiper.autoplay.stop === 'function') swiper.autoplay.stop();
    } else {
      playActiveVideo();
      if (autoplay && swiper && swiper.autoplay && typeof swiper.autoplay.start === 'function') swiper.autoplay.start();
    }
  };
  const onFocusIn = () => {
    progressPaused = true;
    if (swiper && swiper.autoplay && typeof swiper.autoplay.stop === 'function') swiper.autoplay.stop();
  };
  const onFocusOut = () => {
    progressPaused = false;
    if (autoplay && swiper && swiper.autoplay && typeof swiper.autoplay.start === 'function') swiper.autoplay.start();
  };

  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', onVisibility);
  root.addEventListener('focusin', onFocusIn);
  root.addEventListener('focusout', onFocusOut);
  updateFallbackHeight();

  root.__ltdBannerCleanup = () => {
    destroyed = true;
    window.clearTimeout(retryTimer);
    if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
    stopProgress();
    pauseAllVideos();
    window.removeEventListener('resize', onResize);
    document.removeEventListener('visibilitychange', onVisibility);
    root.removeEventListener('focusin', onFocusIn);
    root.removeEventListener('focusout', onFocusOut);
    if (swiper && typeof swiper.destroy === 'function') {
      try { swiper.destroy(true, true); } catch (error) { /* ignore cleanup error */ }
    }
    root.__ltdBannerSwiper = null;
  };
})();
</script>
