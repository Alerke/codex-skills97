    var current = (location.pathname || "/").replace(/\/$/, "") || "/";
    return current === target || (target !== "/" && current.indexOf(target + "/") === 0);
  }

  function hasActiveChild(item) {
    if (isActive(item)) return true;
    return getVisibleNavChildren(item).some(function (child) { return hasActiveChild(child); });
  }

  function closeAllMega(exceptItem) {
    var items = qsa(".nav-item.nav-mega-open");
    var index;
    for (index = 0; index < items.length; index += 1) {
      if (items[index] !== exceptItem) {
        items[index].classList.remove("nav-mega-open");
        var trigger = items[index].querySelector(".nav-link");
        if (trigger) trigger.setAttribute("aria-expanded", "false");
      }
    }
    container.classList.toggle("nav-pc-mega-open", Boolean(qs(".nav-item.nav-mega-open")));
    applyInteractiveSkin();
  }

  function syncOverlayTop() {
    var rect = container.getBoundingClientRect();
    var top = Math.max(0, Math.round(rect.bottom));
    container.style.setProperty("--nav-dropdown-top", top + "px");
  }

  function scheduleLayout() {
    if (layoutFrame) return;
    layoutFrame = nextFrame(function () {
      layoutFrame = 0;
      syncOverlayTop();
    });
  }

  function bindMegaItem(itemElement, trigger) {
    var closeTimer = 0;
    function openMega() {
      if (closeTimer) window.clearTimeout(closeTimer);
      closeAllMega(itemElement);
      scheduleLayout();
      itemElement.classList.add("nav-mega-open");
      container.classList.add("nav-pc-mega-open");
      trigger.setAttribute("aria-expanded", "true");
      applyInteractiveSkin();
    }
    function closeMegaSoon() {
      if (closeTimer) window.clearTimeout(closeTimer);
      closeTimer = window.setTimeout(function () {
        if (!itemElement.contains(document.activeElement)) {
          itemElement.classList.remove("nav-mega-open");
          trigger.setAttribute("aria-expanded", "false");
          container.classList.toggle("nav-pc-mega-open", Boolean(qs(".nav-item.nav-mega-open")));
          applyInteractiveSkin();
        }
      }, 90);
    }
    itemElement.addEventListener("mouseenter", openMega);
    itemElement.addEventListener("mouseleave", closeMegaSoon);
    itemElement.addEventListener("focusin", openMega);
    itemElement.addEventListener("focusout", closeMegaSoon);
  }

  function renderPcNav(data) {
    var list = qs(".nav-list-pc");
    if (!list) return;
    clearElement(list);
    getVisibleNavItems(data).forEach(function (item) {
      var children = getVisibleNavChildren(item);
      var itemElement = document.createElement("div");
      itemElement.className = "nav-item" + (hasActiveChild(item) ? " active" : "");
      var trigger = document.createElement("a");
      trigger.className = "nav-link" + (hasActiveChild(item) ? " active" : "");
      appendTextAnchor(trigger, item);
      itemElement.appendChild(trigger);
      if (children.length) {
        trigger.setAttribute("aria-haspopup", "true");

        children.forEach(function (child) {
          var grandchildren = getVisibleNavChildren(child);
          if (grandchildren.length) grid.appendChild(createMegaGroup(child, grandchildren));

          else grid.appendChild(createMegaTextLink(child));
        });
        dropdown.appendChild(grid);
        itemElement.appendChild(dropdown);
        bindMegaItem(itemElement, trigger);

  function renderMobileNav(data) {
    var rootContent = qs(".nav-mb-root-content");
    var rootView = qs('.nav-mb-view[data-nav-mb-view="root"]');
    var subviews = qs(".nav-mb-subviews");
    if (!rootContent || !rootView || !subviews) return;
    clearElement(rootContent);
    clearElement(subviews);
    rootView.classList.remove("nav-mb-view-exit-left");
    rootView.classList.add("nav-mb-view-active");
    rootView.setAttribute("aria-hidden", "false");

    function createArrow(className) {
      var arrow = document.createElement("span");
      arrow.className = className;
      arrow.setAttribute("aria-hidden", "true");
      return arrow;
    }

    function findCover(item) {
      var direct = getIconUrl(getNavIcon(item));
      if (direct) return direct;
      var descendants = getVisibleNavChildren(item);
      var index;
      for (index = 0; index < descendants.length; index += 1) {
        var nested = findCover(descendants[index]);
        if (nested) return nested;
      }
      return "";
    }

    function showView(viewId) {
      var views = qsa(".nav-mb-view");
      var target = null;
      var active = null;
      var index;
      for (index = 0; index < views.length; index += 1) {
        if (views[index].classList.contains("nav-mb-view-active")) active = views[index];
        if (views[index].getAttribute("data-nav-mb-view") === viewId) target = views[index];
      }
      if (!target || target === active) return;
      if (active) {
        active.classList.remove("nav-mb-view-active");
        active.classList.toggle("nav-mb-view-exit-left", viewId !== "root");
        active.setAttribute("aria-hidden", "true");
      }
      target.classList.remove("nav-mb-view-exit-left");
      target.classList.add("nav-mb-view-active");
      target.setAttribute("aria-hidden", "false");
      target.scrollTop = 0;
    }

    function createRootCard(item, viewId) {
      var children = getVisibleNavChildren(item);
      var element = document.createElement(children.length ? "button" : "a");
      element.className = "nav-mb-card" + (hasActiveChild(item) ? " active" : "");
      if (children.length) {
        element.type = "button";
        element.setAttribute("aria-label", String(getNavName(item)));
        element.addEventListener("click", function () { showView(viewId); });
      } else {
        applyAnchorBasics(element, item);
      }
      var media = document.createElement("span");
      media.className = "nav-mb-card-media";
      var image = document.createElement("img");
      image.src = findCover(item);
      image.alt = String(getNavName(item));
      image.loading = "lazy";
      media.appendChild(image);
      element.appendChild(media);
      var label = document.createElement("span");
      label.className = "nav-mb-card-label";
      label.appendChild(document.createTextNode(String(getNavName(item))));
      label.appendChild(createArrow("nav-mb-card-arrow"));
      element.appendChild(label);
      return element;
    }

    function createFeatureLink(item, viewId) {
      var children = getVisibleNavChildren(item);
      var element = document.createElement(children.length ? "button" : "a");
      element.className = "nav-mb-feature-link" + (hasActiveChild(item) ? " active" : "");
      if (children.length) {
        element.type = "button";
        element.addEventListener("click", function () { showView(viewId); });
      } else {
        applyAnchorBasics(element, item);
      }
      element.appendChild(document.createTextNode(String(getNavName(item))));
      element.appendChild(createArrow("nav-mb-link-arrow"));
      return element;
    }

    function createPromoCard(item) {
      var card = document.createElement("a");
      card.className = "nav-mb-promo-card" + (isActive(item) ? " active" : "");
      applyAnchorBasics(card, item);
      var media = document.createElement("span");
      media.className = "nav-mb-promo-media";
      var image = document.createElement("img");
      image.src = getIconUrl(getNavIcon(item));
      image.alt = String(getNavName(item));
      image.loading = "lazy";
      media.appendChild(image);
      card.appendChild(media);
      var title = document.createElement("span");
      title.className = "nav-mb-promo-title";
      title.textContent = String(getNavName(item));
      card.appendChild(title);
      var remarkText = getNavRemark(item);
      if (remarkText) {
        var remark = document.createElement("span");
        remark.className = "nav-mb-promo-remark";
        remark.textContent = String(remarkText);
        card.appendChild(remark);
      }
      return card;
    }

    function createTextGroup(titleItem, items, fallbackTitle) {
      var group = document.createElement("section");
      group.className = "nav-mb-text-group";
      var title = document.createElement(titleItem ? "a" : "h3");
      title.className = "nav-mb-group-title";
      if (titleItem) appendTextAnchor(title, titleItem);
      else title.textContent = fallbackTitle;
      group.appendChild(title);
      var links = document.createElement("div");
      links.className = "nav-mb-group-links";
      items.forEach(function (item) {
        var link = document.createElement("a");
        link.className = isActive(item) ? "active" : "";
        appendTextAnchor(link, item);
        links.appendChild(link);
      });
      group.appendChild(links);
      return group;
    }

    function buildSubview(item, viewId) {
      var view = document.createElement("section");
      view.className = "nav-mb-view";
      view.setAttribute("data-nav-mb-view", viewId);
      view.setAttribute("aria-hidden", "true");
      var back = document.createElement("button");
      back.className = "nav-mb-back";
      back.type = "button";
      back.appendChild(createArrow("nav-mb-link-arrow"));
      back.appendChild(document.createTextNode(String(getNavName(item))));
      back.addEventListener("click", function () { showView("root"); });
      view.appendChild(back);

      var content = document.createElement("div");
      content.className = "nav-mb-submenu-content";
      var promo = document.createElement("div");
      promo.className = "nav-mb-promo-grid";
      var plainItems = [];
      getVisibleNavChildren(item).forEach(function (child) {
        var grandchildren = getVisibleNavChildren(child);
        if (grandchildren.length) {
          content.appendChild(createTextGroup(child, grandchildren, ""));
        } else if (getIconUrl(getNavIcon(child))) {
          promo.appendChild(createPromoCard(child));
        } else {
          plainItems.push(child);
        }
      });
      if (promo.childNodes.length) content.insertBefore(promo, content.firstChild);
      if (plainItems.length) content.appendChild(createTextGroup(null, plainItems, getI18nText("moreLinksTitle", "更多")));
      view.appendChild(content);
      subviews.appendChild(view);
    }

    var visualItems = [];
    var featureItems = [];
    getVisibleNavItems(data).forEach(function (item, index) {
      var viewId = "menu-" + index;
      if (getVisibleNavChildren(item).length) buildSubview(item, viewId);
      if (findCover(item)) visualItems.push({ item: item, viewId: viewId });
      else featureItems.push({ item: item, viewId: viewId });
    });

    if (visualItems.length) {
      var cards = document.createElement("div");
      cards.className = "nav-mb-card-grid";
      visualItems.forEach(function (entry) { cards.appendChild(createRootCard(entry.item, entry.viewId)); });
      rootContent.appendChild(cards);
    }
    if (featureItems.length) {
      var featured = document.createElement("section");
      featured.className = "nav-mb-section";
      var featuredTitle = document.createElement("h2");
      featuredTitle.className = "nav-mb-section-title";
      featuredTitle.textContent = getI18nText("featuredTitle", "精选推荐");
      featured.appendChild(featuredTitle);
      var featuredList = document.createElement("div");
      featuredList.className = "nav-mb-feature-list";
      featureItems.forEach(function (entry) { featuredList.appendChild(createFeatureLink(entry.item, entry.viewId)); });
      featured.appendChild(featuredList);
      rootContent.appendChild(featured);
    }
    mobileViewController = { showRoot: function () { showView("root"); } };
  }

  function syncBodyScrollLock() {
    var shouldLock = container.classList.contains("nav-open") || container.classList.contains("nav-search-open");
    if (shouldLock && previousBodyOverflow === null) {
      previousBodyOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
    } else if (!shouldLock && previousBodyOverflow !== null) {
      document.body.style.overflow = previousBodyOverflow;
      previousBodyOverflow = null;
    }
  }

  function setupMobileMenu() {
    var trigger = qs(".nav-hamburger");
    var menu = qs(".nav-mb-menu");
    if (!trigger || !menu) return { closeMenu: function () {} };
    menu.id = instanceId + "_menu";
    trigger.setAttribute("aria-controls", menu.id);
    function openMenu() {
      if (searchControls) searchControls.closeMobile();
      container.classList.add("nav-open");
      trigger.setAttribute("aria-expanded", "true");
      trigger.setAttribute("aria-label", getI18nText("closeMenu", "关闭菜单"));
      menu.setAttribute("aria-hidden", "false");
      applyInteractiveSkin();
      syncBodyScrollLock();
    }
    function closeMenu() {
      container.classList.remove("nav-open");
      trigger.setAttribute("aria-expanded", "false");
      trigger.setAttribute("aria-label", getI18nText("openMenu", "打开菜单"));
      menu.setAttribute("aria-hidden", "true");
      applyInteractiveSkin();
      syncBodyScrollLock();
      window.setTimeout(function () {
        if (!container.classList.contains("nav-open") && mobileViewController) mobileViewController.showRoot();
      }, 500);
    }
    trigger.addEventListener("click", function () {
      if (container.classList.contains("nav-open")) closeMenu(); else openMenu();
    });
    return { closeMenu: closeMenu, openMenu: openMenu };
  }

  function setupSearch() {
    var pcTrigger = qs(".nav-search-trigger");
    var pcPanel = qs(".nav-search-pc");
    var mobileTrigger = qs(".nav-search-trigger-mb");
    var mobilePanel = qs(".nav-mb-search-panel");
    var mobileClose = qs(".nav-mb-search-close");
    var mobileBackdrop = qs(".nav-mb-search-backdrop");

    if (!CONFIG.showSearch) {
      if (pcTrigger) pcTrigger.style.display = "none";
      if (mobileTrigger) mobileTrigger.style.display = "none";
    }

    function closePc() {
      if (!pcPanel) return;
      pcPanel.classList.remove("open");
      container.classList.remove("nav-pc-search-open");
      pcPanel.setAttribute("aria-hidden", "true");
      if (pcTrigger) pcTrigger.setAttribute("aria-expanded", "false");
      applyInteractiveSkin();
    }

    function openPc() {
      if (!pcPanel || !CONFIG.showSearch) return;
      closeAllMega(null);
      scheduleLayout();
      pcPanel.classList.add("open");
      container.classList.add("nav-pc-search-open");
      pcPanel.setAttribute("aria-hidden", "false");
      if (pcTrigger) pcTrigger.setAttribute("aria-expanded", "true");
      applyInteractiveSkin();
      var input = pcPanel.querySelector("input");
      if (input) input.focus();
    }

    function closeMobile() {
      if (!mobilePanel) return;
      container.classList.remove("nav-search-open");
      mobilePanel.setAttribute("aria-hidden", "true");
      if (mobileTrigger) mobileTrigger.setAttribute("aria-expanded", "false");
      applyInteractiveSkin();
      syncBodyScrollLock();
    }

    function openMobile() {
      if (!mobilePanel || !CONFIG.showSearch) return;
      if (menuControls) menuControls.closeMenu();
      container.classList.add("nav-search-open");
      mobilePanel.setAttribute("aria-hidden", "false");
      if (mobileTrigger) mobileTrigger.setAttribute("aria-expanded", "true");
      applyInteractiveSkin();
      syncBodyScrollLock();
      var input = mobilePanel.querySelector("input");
      if (input) input.focus();
    }

    function submitSearch(form) {
      var input = form.querySelector('input[name="keywords"]');
      var keyword = input ? String(input.value || "").trim() : "";
      if (!keyword) { if (input) input.focus(); return; }
      var base = sanitizeNavHref(CONFIG.searchLink.href || "/search");
      if (base === "javascript:void(0);") return;
      var href = base + (base.indexOf("?") >= 0 ? "&" : "?") + "keywords=" + encodeURIComponent(keyword);
      if (CONFIG.searchLink.target === "_blank") window.open(href, "_blank", "noopener,noreferrer");
      else location.href = href;
    }

    if (pcTrigger) pcTrigger.addEventListener("click", function () {
      if (pcPanel && pcPanel.classList.contains("open")) closePc(); else openPc();
    });
    if (mobileTrigger) mobileTrigger.addEventListener("click", openMobile);
    if (mobileClose) mobileClose.addEventListener("click", closeMobile);
    if (mobileBackdrop) mobileBackdrop.addEventListener("click", closeMobile);

    var forms = qsa(".nav-search-form, .nav-mb-search-form");
    var index;
    for (index = 0; index < forms.length; index += 1) {
      forms[index].addEventListener("submit", function (event) {
        event.preventDefault();
        submitSearch(event.currentTarget);
      });
    }

    container.addEventListener("click", function (event) {
      if (pcPanel && pcTrigger && !pcPanel.contains(event.target) && !pcTrigger.contains(event.target)) closePc();
    });
    var pcOverlay = qs(".nav-pc-overlay");
    if (pcOverlay) pcOverlay.addEventListener("click", function () {
      closeAllMega(null);
      closePc();
    });
    return { closePc: closePc, closeMobile: closeMobile };
  }

  function switchLanguage(code, href, target) {
    setStored("lang", code);
    var safeHref = sanitizeNavHref(href);
    if (safeHref === "javascript:void(0);") return;
    if (target === "_blank") window.open(safeHref, "_blank", "noopener,noreferrer");
    else location.href = safeHref;
  }

  function normalizeCustomLanguages(items) {
    return getVisibleNavItems(items).map(function (item) {
      var jump = item && item.jump;
      var jumpObject = jump && typeof jump === "object" ? jump : {};
      return {
        value: String(getNavField(item, "id", "value", "language_type") || ""),
        label: String(getNavName(item) || ""),
        href: sanitizeNavHref(typeof jump === "string" ? jump : getNavField(jumpObject, "href", "url")),
        target: getNavField(jumpObject, "target") || "_self"
      };
    }).filter(function (item) { return item.value && item.label; });
  }

  function renderLanguages(languages) {
    var pc = qs(".nav-lang");
    var mobile = qs(".nav-mb-lang");
    if (!languages || languages.length < 2) {
      if (pc) pc.style.display = "none";
      if (mobile) mobile.style.display = "none";
      return;
    }
    var current = getStored("lang", "zh-cn");
    if (pc) {
      clearElement(pc);
      var toggle = document.createElement("button");
      toggle.className = "nav-lang-toggle";
      toggle.type = "button";
      toggle.textContent = current.split("-")[0];
      toggle.setAttribute("aria-haspopup", "true");
      pc.appendChild(toggle);
      var dropdown = document.createElement("div");
      dropdown.className = "nav-lang-dropdown";
      languages.forEach(function (language) {
        var link = document.createElement("a");
        link.href = sanitizeNavHref(language.href || "/");
        link.target = language.target === "_blank" ? "_blank" : "_self";
        if (link.target === "_blank") link.rel = "noopener noreferrer";
        link.className = language.value === current ? "active" : "";
        link.textContent = language.label || language.value;
        link.addEventListener("click", function (event) {
          event.preventDefault();
          switchLanguage(language.value, link.href, link.target);
        });
        dropdown.appendChild(link);
      });
      pc.appendChild(dropdown);
    }
    if (mobile) {
      clearElement(mobile);
      languages.forEach(function (language) {
        var link = document.createElement("a");
        link.href = sanitizeNavHref(language.href || "/");
        link.target = language.target === "_blank" ? "_blank" : "_self";
        if (link.target === "_blank") link.rel = "noopener noreferrer";
        link.className = language.value === current ? "active" : "";
        link.textContent = language.label || language.value;
        link.addEventListener("click", function (event) {
          event.preventDefault();
          switchLanguage(language.value, link.href, link.target);
        });
        mobile.appendChild(link);
      });
    }
  }

  function fetchPlatformLanguages() {
    if (typeof r !== "function") return Promise.resolve(null);
    return r({
      url: "/shop/frontend/languageList",
      data: { website_id: getStored("websiteId", "") }
    }).then(function (response) {
      return response && response.code === 0 && Array.isArray(response.data) ? response.data : null;
    });
  }

  function initLanguages() {
    if (CONFIG.useCustomLanguageJump) {
      renderLanguages(normalizeCustomLanguages(CONFIG.languageNav));
      return;
    }
    fetchPlatformLanguages().then(function (items) {
      if (!items) { renderLanguages([]); return; }
      renderLanguages(items.map(function (item) {
        return {
          value: item.value || item.language_type || item.code || "",
          label: item.label || item.language_name || item.name || "",
          href: item.href || item.url || "/",
          target: item.target || "_self"
        };
      }));
    }).catch(function () { renderLanguages([]); });
  }

  function setupLogin() {
    var logins = qsa(".nav-login, .nav-login-mb, .nav-mb-login");
    if (!logins.length) return;
    var loggedIn = Boolean(getStored("GwShopUserToken", ""));
    var label = loggedIn ? getI18nText("loginUserName", "用户中心") : getI18nText("loginText", "登录");
    var index;
    for (index = 0; index < logins.length; index += 1) {
      if (!CONFIG.showLogin) {
        logins[index].style.display = "none";
      } else {
        logins[index].href = loggedIn ? "/member" : "/login";
        logins[index].target = "_self";
        logins[index].setAttribute("aria-label", label);
        if (logins[index].classList.contains("nav-mb-login")) logins[index].textContent = label;
      }
    }
  }

  function applyI18nUi() {
    var searchButtons = qsa(".nav-search-trigger, .nav-search-trigger-mb");
    var searchInputs = qsa('input[name="keywords"]');
    var searchSubmit = qsa(".nav-search-submit");
    var index;
    for (index = 0; index < searchButtons.length; index += 1) searchButtons[index].setAttribute("aria-label", getI18nText("searchLabel", "搜索"));
    for (index = 0; index < searchInputs.length; index += 1) searchInputs[index].placeholder = getI18nText("searchPlaceholder", "搜索");
    for (index = 0; index < searchSubmit.length; index += 1) searchSubmit[index].textContent = getI18nText("searchLabel", "搜索");
    var hamburger = qs(".nav-hamburger");
    var searchClose = qs(".nav-mb-search-close");
    if (hamburger) hamburger.setAttribute("aria-label", getI18nText("openMenu", "打开菜单"));
    if (searchClose) searchClose.textContent = getI18nText("closeSearch", "取消");
  }

  function syncHostHeight() {
    if (!moduleElement) return;
    moduleElement.style.setProperty("--nav-h", (window.innerWidth <= 1024 ? 60 : 72) + "px");
  }

  function applyStickyOffset() {
    var warning = document.querySelector(".editor-warning-saaas-host-only");
    var offset = 0;
    if (warning) {
      var style = window.getComputedStyle(warning);
      if (style.display !== "none" && style.visibility !== "hidden") offset = Math.max(0, Math.round(warning.getBoundingClientRect().height || warning.offsetHeight || 0));
    }
    var value = offset + "px";
    container.style.setProperty("--nav-sticky-top-offset", value);
    if (moduleElement) moduleElement.style.setProperty("--nav-sticky-top-offset", value);
    scheduleLayout();
  }

  function initStickyOffset() {
    applyStickyOffset();
    var warning = document.querySelector(".editor-warning-saaas-host-only");
    if (warning && window.ResizeObserver) {
      var resizeObserver = new window.ResizeObserver(applyStickyOffset);
      resizeObserver.observe(warning);
    }
    var inEditor = Boolean(moduleElement && matchesElement(moduleElement, ".code-component.gw-editor-component"));
    if (inEditor && window.MutationObserver) {
      var mutationObserver = new window.MutationObserver(applyStickyOffset);
      mutationObserver.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style"] });
    }
  }

  function injectTheme() {
    var supportsBlur = Boolean(window.CSS && typeof window.CSS.supports === "function" && (window.CSS.supports("backdrop-filter", "blur(1px)") || window.CSS.supports("-webkit-backdrop-filter", "blur(1px)")));
    container.style.setProperty("--theme", CONFIG.themeColor);
    container.style.setProperty("--nav-bg", CONFIG.navBackground);
    container.style.setProperty("--nav-text", CONFIG.navTextColor);
    container.style.setProperty("--company-name-color", CONFIG.companyNameColor);
    container.style.setProperty("--mobile-menu-company-name-color", CONFIG.mobileMenuCompanyNameColor);
    container.style.setProperty("--nav-blur", supportsBlur ? Math.max(0, CONFIG.navBlur) + "px" : "0px");
    syncHostHeight();
  }

  function setFloatingState(floating) {
    container.classList.toggle("nav-floating", floating);
    container.classList.toggle("nav-static", !floating);
    if (moduleElement) moduleElement.classList.toggle(HOST_FLOATING_CLASS, floating);
  }

  function setNavSkin(sticky, force) {
    if (currentStickySkin === sticky && !force) return;
    currentStickySkin = sticky;
    container.classList.toggle("nav-sticky-skin", sticky);
    container.style.setProperty("--nav-bg", sticky ? CONFIG.stickyNavBackground : CONFIG.navBackground);
    container.style.setProperty("--nav-text", sticky ? CONFIG.stickyNavTextColor : CONFIG.navTextColor);
    container.style.setProperty("--company-name-color", sticky ? CONFIG.stickyCompanyNameColor : CONFIG.companyNameColor);
    applyLogoSkin(sticky);
  }

  function applyInteractiveSkin() {
    var desktopInteractive = container.classList.contains("nav-pc-mega-open") || container.classList.contains("nav-pc-search-open");
    var mobileInteractive = container.classList.contains("nav-open") || container.classList.contains("nav-search-open");
    if ((desktopInteractive && window.innerWidth > 1024) || (mobileInteractive && window.innerWidth <= 1024)) {
      container.style.setProperty("--nav-bg", CONFIG.stickyNavBackground);
      container.style.setProperty("--nav-text", CONFIG.stickyNavTextColor);
      container.style.setProperty("--company-name-color", mobileInteractive ? CONFIG.mobileMenuCompanyNameColor : CONFIG.stickyCompanyNameColor);
      applyLogoSkin(true);
      return;
    }
    setNavSkin(Boolean(currentStickySkin), true);
  }

  function setupSticky() {
    setFloatingState(CONFIG.stickyEnabled);
    function update() {
      setNavSkin(CONFIG.stickyEnabled && window.pageYOffset >= Math.max(0, CONFIG.stickyScrollDistance));
      scheduleLayout();
    }
    window.addEventListener("scroll", update, false);
    update();
  }

  function fetchTopNav() {
    if (typeof r !== "function") return Promise.resolve(null);
    return r({
      url: "/api/navCat",
      data: {
        website_id: getStored("websiteId", ""),
        position: 1,
        language_type: getStored("lang", "zh-cn")
      }
    }).then(function (response) {
      return response && response.code === 0 && Array.isArray(response.data) ? response.data : null;
    });
  }

  function renderNavigation(data) {
    renderPcNav(data);
    renderMobileNav(data);
  }

  function init() {
    injectTheme();
    initStickyOffset();
    applyI18nUi();
    setupBrand();
    setupLogin();
    renderContact();
    setupSticky();
    searchControls = setupSearch();
    menuControls = setupMobileMenu();
    initLanguages();

    if (CONFIG.nav.length) {
      renderNavigation(CONFIG.nav);
    } else {
      renderNavigation(FALLBACK_NAV);
      fetchTopNav().then(function (data) {
        if (data && data.length) renderNavigation(data);
      }).catch(function () { return; });
    }

    document.addEventListener("keydown", function (event) {
      if (event.key !== "Escape" && event.keyCode !== 27) return;
      closeAllMega(null);
      if (searchControls) { searchControls.closePc(); searchControls.closeMobile(); }
      if (menuControls) menuControls.closeMenu();
    });

    window.addEventListener("resize", function () {
      syncHostHeight();
      applyStickyOffset();
      if (window.innerWidth > 1024) {
        if (searchControls) searchControls.closeMobile();
        if (menuControls) menuControls.closeMenu();
      } else {
        closeAllMega(null);
        if (searchControls) searchControls.closePc();
      }
      scheduleLayout();
    }, false);
  }

  init();
})();
</script>
