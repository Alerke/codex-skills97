<script>

  const applyLink = (anchor, item) => { const href = safeHref(navLink(item)); if (!href) { anchor.removeAttribute('href'); anchor.removeAttribute('target'); anchor.setAttribute('role', 'text'); return false; } anchor.href = href; anchor.target = navTarget(item) === '_blank' ? '_blank' : '_self'; if (anchor.target === '_blank') anchor.rel = 'noopener noreferrer'; return true; };
