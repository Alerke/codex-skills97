<script>
(function () {
  'use strict';

  const script = document.currentScript;
  const previous = script ? script.previousElementSibling : null;
  const moduleHost = script && script.closest ? script.closest('.gw-browse-module') : null;
  const root = previous && previous.classList && previous.classList.contains('ltdVitaContactsForm20260813')
    ? previous
    : (moduleHost ? moduleHost.querySelector('.ltdVitaContactsForm20260813') : null);
  if (!root) return;

  const customSubmitButton = root.querySelector('.ltd-vita-contacts-submit');

  const findPresetSubmitButton = () => {
    const candidates = root.querySelectorAll([
      '.gw-fit-form-actions [data-submit-form]',
      '.gw-fit-form-actions button[type="submit"]',
      '.gw-fit-form-actions input[type="submit"]',
      '.gw-fit-form-actions .gw-fit-form-button:not(.is-secondary)',
      'button.gw-fit-form-button[type="submit"]',
      'input.gw-fit-form-button[type="submit"]',
      '[data-submit-form]'
    ].join(','));

    for (let index = 0; index < candidates.length; index += 1) {
      const candidate = candidates[index];
      if (!candidate.closest('.gw-fit-form-captcha') && !candidate.classList.contains('is-secondary')) return candidate;
    }
    return null;
  };

  const findPresetForm = () => root.querySelector('form[data-ltd-form-module], [data-ltd-form-module][data-form-id], form.gw-fit-form-dom');

  const findFormRuntime = () => {
    const form = findPresetForm();
    if (!form) return null;
    const formId = form.getAttribute('data-submit-form-id') || form.getAttribute('data-form-id') || '';
    if (!formId) return null;
    const runtimeNames = ['fitForm_' + formId];
    for (let index = 0; index < runtimeNames.length; index += 1) {
      const directRuntime = window[runtimeNames[index]];
      if (directRuntime && typeof directRuntime.submit === 'function') return directRuntime;
    }
    const runtimeRegistry = window.__GwCodeRuntime;
    for (let index = 0; index < runtimeNames.length; index += 1) {
      const registryRuntime = runtimeRegistry && runtimeRegistry[runtimeNames[index]];
      if (registryRuntime && typeof registryRuntime.submit === 'function') return registryRuntime;
    }
    const visualRuntime = window.VisualModuleRuntime;
    const runtimeList = visualRuntime && typeof visualRuntime.list === 'function' ? visualRuntime.list('form') : [];
    for (let index = 0; index < runtimeList.length; index += 1) {
      const api = runtimeList[index];
      if (api && String(api.id || '') === String(formId) && typeof api.submit === 'function') return api;
    }
    return null;
  };

  const showRuntimeError = () => {
    const message = '表单尚未初始化，请稍后重试';
    const utilsToast = window.Utils && window.Utils.Toast;
    if (utilsToast && typeof utilsToast.error === 'function') {
      utilsToast.error(message);
      return;
    }
    if (window.toast && typeof window.toast.error === 'function') {
      window.toast.error(message);
      return;
    }
    if (window.console && typeof window.console.warn === 'function') window.console.warn('[Vita Contacts] ' + message);
  };

  const submitWithPreset = (button) => {
    const runtime = findFormRuntime();
    if (runtime) {
      const readyResult = typeof runtime.ready === 'function' ? runtime.ready() : runtime;
      Promise.resolve(readyResult).then(() => runtime.submit(button)).catch(() => showRuntimeError());
      return;
    }

    const presetSubmitButton = findPresetSubmitButton();
    if (presetSubmitButton && !presetSubmitButton.disabled) {
      presetSubmitButton.click();
      return;
    }
    showRuntimeError();
  };

  if (customSubmitButton) {
    if (customSubmitButton._ltdVitaContactsClick) customSubmitButton.removeEventListener('click', customSubmitButton._ltdVitaContactsClick);
    const handleSubmitClick = (event) => {
      event.preventDefault();
      if (customSubmitButton.disabled) return;
      submitWithPreset(customSubmitButton);
    };
    customSubmitButton._ltdVitaContactsClick = handleSubmitClick;
    customSubmitButton.addEventListener('click', handleSubmitClick);
  }

  const image = root.querySelector('.ltd-vita-contacts-image');
  if (!image || root.dataset.vitaContactsImageReady === '1') return;
  root.dataset.vitaContactsImageReady = '1';

  const showImageFallback = () => root.classList.add('is-image-error');
  if (!image.getAttribute('src')) {
    showImageFallback();
    return;
  }
  if (image.complete && image.naturalWidth === 0) showImageFallback();
  image.addEventListener('error', showImageFallback, { once: true });
}());
</script>
